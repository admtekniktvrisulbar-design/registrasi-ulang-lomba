<script>


// =====================================================
// API
// =====================================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbyCnvBr41uRfF8FUt-ZmbeF1j7pcazsqBvnSVLkreITP1YYK7ZIvmwlhkFJA1Px9qso/exec";


// =====================================================
// VARIABEL
// =====================================================

let scanner = null;

let sudahScan = false;

let idPesertaAktif = "";

let nomorPesertaHasilRegistrasi = "";

let hasilPesertaManual = [];

let sedangMencari = false;

let sedangRegistrasi = false;


// =====================================================
// ELEMENT
// =====================================================

function el(id) {

  return document.getElementById(id);

}


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHTML(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  return String(value)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}


// =====================================================
// NORMALISASI ID PESERTA
// =====================================================
//
// Ini bagian penting untuk mengatasi response API
// yang saat ini terlihat bergeser.
//
// ID peserta kita mempunyai pola:
//
// MW46-001
// MG12-002
//
// Sedangkan:
//
// CellImage
// bukan ID peserta.
//
// Jika field idPeserta berisi CellImage tetapi
// statusPembayaran berisi MW46-001,
// maka MW46-001 akan digunakan sebagai ID.
// =====================================================

function adalahIDPeserta(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return false;

  }


  return /^[A-Z]{2}\d{2,}-\d{3,}$/i.test(
    String(value).trim()
  );

}


// =====================================================
// CEK NOMOR PESERTA
// =====================================================
//
// Nomor setelah registrasi:
//
// A-001
// B-001
//
// =====================================================

function adalahNomorPeserta(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return false;

  }


  return /^[A-Z]-\d{3,}$/i.test(
    String(value).trim()
  );

}


// =====================================================
// CEK STATUS PEMBAYARAN
// =====================================================

function adalahStatusPembayaran(value) {

  const text =
    String(
      value || ""
    )
    .trim()
    .toLowerCase();


  return (

    text === "lunas" ||

    text === "belum lunas" ||

    text === "belum_lunas" ||

    text === "belum bayar" ||

    text === "sudah bayar"

  );

}


// =====================================================
// NORMALISASI DATA PESERTA
// =====================================================
//
// Fungsi ini menjaga agar frontend tidak salah
// membaca CellImage sebagai ID Peserta.
//
// Kita tidak mengubah data spreadsheet.
// Kita hanya memperbaiki pembacaan response API.
// =====================================================

function normalisasiPeserta(data) {

  if (
    !data ||
    typeof data !== "object"
  ) {

    return data;

  }


  const peserta = {
    ...data
  };


  // ===================================================
  // CARI ID PESERTA YANG BENAR
  // ===================================================

  let id =
    String(
      peserta.idPeserta ||
      ""
    ).trim();


  // Jika idPeserta valid, gunakan langsung.

  if (
    !adalahIDPeserta(id)
  ) {

    const kandidat = [

      peserta.id,

      peserta.ID,

      peserta["ID Peserta"],

      peserta.nomor,

      peserta.statusPembayaran,

      peserta.kode

    ];


    for (
      const item of kandidat
    ) {

      if (
        adalahIDPeserta(item)
      ) {

        id =
          String(
            item
          ).trim();

        break;

      }

    }

  }


  // ===================================================
  // SIMPAN ID YANG SUDAH DINORMALISASI
  // ===================================================

  if (id) {

    peserta.idPeserta =
      id;

  }


  // ===================================================
  // NORMALISASI NOMOR PESERTA
  // ===================================================

  let nomor =
    String(
      peserta.nomor ||
      ""
    ).trim();


  if (
    !adalahNomorPeserta(nomor)
  ) {

    const kandidatNomor = [

      peserta.nomorPeserta,

      peserta["Nomor Peserta"],

      peserta.nomorRegistrasi

    ];


    for (
      const item of kandidatNomor
    ) {

      if (
        adalahNomorPeserta(item)
      ) {

        nomor =
          String(
            item
          ).trim();

        break;

      }

    }

  }


  if (nomor) {

    peserta.nomor =
      nomor;

  }


  // ===================================================
  // NORMALISASI STATUS PEMBAYARAN
  // ===================================================
  //
  // Dari screenshot:
  //
  // statusPembayaran = MW46-001
  // statusRegistrasi = Lunas
  //
  // Artinya field sedang bergeser.
  //
  // Kita pindahkan "Lunas" menjadi status pembayaran.
  // ===================================================

  let pembayaran =
    String(
      peserta.statusPembayaran ||
      ""
    ).trim();


  let registrasi =
    String(
      peserta.statusRegistrasi ||
      ""
    ).trim();


  if (
    !adalahStatusPembayaran(
      pembayaran
    ) &&
    adalahStatusPembayaran(
      registrasi
    )
  ) {

    pembayaran =
      registrasi;

  }


  // ===================================================
  // STATUS REGISTRASI
  // ===================================================

  // Jika sudah mempunyai nomor peserta A-001,
  // berarti sudah registrasi.

  if (
    adalahNomorPeserta(
      peserta.nomor
    )
  ) {

    registrasi =
      "Sudah Registrasi";

  }


  // Jika field statusRegistrasi ternyata berisi
  // status pembayaran, jangan tampilkan "Lunas"
  // sebagai status registrasi.

  else if (
    adalahStatusPembayaran(
      registrasi
    )
  ) {

    registrasi =
      "Belum Registrasi";

  }


  // Jika kosong.

  if (!registrasi) {

    registrasi =
      "Belum Registrasi";

  }


  peserta.statusPembayaran =
    pembayaran;


  peserta.statusRegistrasi =
    registrasi;


  return peserta;

}


// =====================================================
// FORMAT WAKTU
// =====================================================

function formatWaktu(waktu) {

  if (
    waktu === null ||
    waktu === undefined ||
    waktu === ""
  ) {

    return "";

  }


  try {

    let tanggal;


    if (
      waktu instanceof Date
    ) {

      tanggal =
        waktu;

    }

    else if (
      typeof waktu === "number"
    ) {

      if (
        waktu > 100000000000
      ) {

        tanggal =
          new Date(waktu);

      }

      else if (
        waktu > 1000000000
      ) {

        tanggal =
          new Date(
            waktu * 1000
          );

      }

      else {

        tanggal =
          new Date(
            (
              waktu - 25569
            ) *
            86400000
          );

      }

    }

    else {

      const nilai =
        String(waktu).trim();


      if (
        /^\d{4}-\d{2}-\d{2}T/.test(
          nilai
        )
      ) {

        tanggal =
          new Date(nilai);

      }

      else if (
        /^\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}/.test(
          nilai
        )
      ) {

        const bagian =
          nilai.split(/\s+/);

        const tanggalBagian =
          bagian[0].split("-");

        const waktuBagian =
          (
            bagian[1] ||
            "00:00:00"
          ).split(":");


        tanggal =
          new Date(

            Number(
              tanggalBagian[0]
            ),

            Number(
              tanggalBagian[1]
            ) - 1,

            Number(
              tanggalBagian[2]
            ),

            Number(
              waktuBagian[0]
            ),

            Number(
              waktuBagian[1]
            ),

            Number(
              waktuBagian[2] || 0
            )

          );

      }

      else if (
        /^\d{2}\/\d{2}\/\d{4}/.test(
          nilai
        )
      ) {

        const bersih =
          nilai.replace(
            ",",
            " "
          );


        const bagian =
          bersih.split(/\s+/);

        const tanggalBagian =
          bagian[0].split("/");

        const waktuBagian =
          (
            bagian[1] ||
            "00:00:00"
          ).split(":");


        tanggal =
          new Date(

            Number(
              tanggalBagian[2]
            ),

            Number(
              tanggalBagian[1]
            ) - 1,

            Number(
              tanggalBagian[0]
            ),

            Number(
              waktuBagian[0]
            ),

            Number(
              waktuBagian[1]
            ),

            Number(
              waktuBagian[2] || 0
            )

          );

      }

      else {

        tanggal =
          new Date(nilai);

      }

    }


    if (
      !tanggal ||
      isNaN(
        tanggal.getTime()
      )
    ) {

      return String(waktu);

    }


    return tanggal.toLocaleString(

      "id-ID",

      {

        day:
          "2-digit",

        month:
          "2-digit",

        year:
          "numeric",

        hour:
          "2-digit",

        minute:
          "2-digit",

        second:
          "2-digit",

        hour12:
          false,

        timeZone:
          "Asia/Makassar"

      }

    );

  }

  catch (error) {

    console.error(
      "Gagal memformat waktu:",
      error
    );


    return String(waktu);

  }

}


// =====================================================
// HENTIKAN SCANNER
// =====================================================

async function hentikanScanner() {

  if (!scanner) {

    return;

  }


  const scannerYangDihentikan =
    scanner;


  scanner =
    null;


  try {

    await scannerYangDihentikan.stop();

  }

  catch (error) {

    console.log(
      "Scanner sudah berhenti:",
      error
    );

  }


  try {

    await scannerYangDihentikan.clear();

  }

  catch (error) {

    console.log(
      "Reader sudah dibersihkan:",
      error
    );

  }

}


// =====================================================
// KEMBALI MENU
// =====================================================

async function kembaliKeMenu() {

  if (
    sedangRegistrasi
  ) {

    return;

  }


  await hentikanScanner();


  el("reader").innerHTML =
    "";

  el("hasil").innerHTML =
    "";

  el("hasilPencarian").innerHTML =
    "";


  el("reader").style.display =
    "none";

  el("hasil").style.display =
    "none";

  el("pencarian").style.display =
    "none";

  el("menuUtama").style.display =
    "block";


  sudahScan =
    false;

  idPesertaAktif =
    "";

  nomorPesertaHasilRegistrasi =
    "";

  hasilPesertaManual =
    [];

  sedangMencari =
    false;


  el("mulaiButton").disabled =
    false;

  el("cariManualButton").disabled =
    false;

}


// =====================================================
// BUKA PENCARIAN
// =====================================================

async function bukaPencarian() {

  await hentikanScanner();


  el("menuUtama").style.display =
    "none";

  el("reader").style.display =
    "none";

  el("reader").innerHTML =
    "";

  el("hasil").style.display =
    "none";

  el("hasil").innerHTML =
    "";

  el("pencarian").style.display =
    "block";

  el("hasilPencarian").innerHTML =
    "";

  el("inputPencarian").value =
    "";


  idPesertaAktif =
    "";

  nomorPesertaHasilRegistrasi =
    "";

  sudahScan =
    false;


  setTimeout(
    function() {

      el("inputPencarian").focus();

    },
    100
  );

}


// =====================================================
// SCANNER
// =====================================================

async function mulaiScanner() {

  await hentikanScanner();


  el("menuUtama").style.display =
    "none";

  el("pencarian").style.display =
    "none";

  el("hasil").style.display =
    "none";

  el("hasil").innerHTML =
    "";

  el("reader").innerHTML =
    "";

  el("reader").style.display =
    "block";


  sudahScan =
    false;

  idPesertaAktif =
    "";

  nomorPesertaHasilRegistrasi =
    "";


  scanner =
    new Html5Qrcode(
      "reader"
    );


  const config = {

    fps:
      10,

    qrbox: {

      width:
        250,

      height:
        250

    }

  };


  try {

    await scanner.start(

      {
        facingMode:
          "environment"
      },

      config,

      onScanSuccess,

      onScanFailure

    );

  }

  catch (error) {

    console.error(
      "Kamera gagal:",
      error
    );


    el("reader").innerHTML = `

      <div class="error">

        ❌ KAMERA TIDAK DAPAT DIAKSES

        <br><br>

        Pastikan izin kamera
        sudah diberikan.

        <br><br>

        ${escapeHTML(error)}

      </div>

    `;


    el("menuUtama").style.display =
      "block";

  }

}


// =====================================================
// QR BERHASIL
// =====================================================

async function onScanSuccess(
  decodedText,
  decodedResult
) {

  if (sudahScan) {

    return;

  }


  sudahScan =
    true;


  idPesertaAktif =
    String(
      decodedText
    ).trim();


  await hentikanScanner();


  tampilkanLoading();


  cekPeserta(
    idPesertaAktif
  );

}

// =====================================================
// CEK PESERTA
// =====================================================

function cekPeserta(idPeserta) {

  fetch(

    API_URL +
    "?action=cek&nomor=" +
    encodeURIComponent(
      idPeserta
    ),

    {

      method:
        "GET",

      cache:
        "no-store"

    }

  )

  .then(
    function(response) {

      if (!response.ok) {

        throw new Error(
          "HTTP Error " +
          response.status
        );

      }


      return response.json();

    }
  )

  .then(
    function(data) {

      console.log(
        "Respons API:",
        data
      );


      if (

        data.success &&
        data.ditemukan &&
        data.peserta

      ) {

        const peserta =
          normalisasiPeserta(
            data.peserta
          );


        if (
          peserta.idPeserta
        ) {

          idPesertaAktif =
            peserta.idPeserta;

        }


        tampilkanPeserta(
          peserta
        );

      }

      else {

        tampilkanPesertaTidakDitemukan(

          data.message ||
          "ID Peserta tidak ditemukan."

        );

      }

    }
  )

  .catch(
    function(error) {

      console.error(
        "Error API:",
        error
      );


      tampilkanErrorAPI();

    }
  );

}


// =====================================================
// CARI MANUAL
// =====================================================

async function cariManual() {

  if (sedangMencari) {

    return;

  }


  const input =
    el("inputPencarian");


  const keyword =
    input.value.trim();


  const hasil =
    el("hasilPencarian");


  if (!keyword) {

    alert(
      "Masukkan ID Peserta, nomor peserta, atau nama peserta."
    );


    input.focus();

    return;

  }


  sedangMencari =
    true;


  hasil.innerHTML = `

    <div class="loading">

      🔄 MENCARI PESERTA...

      <br><br>

      Mohon tunggu...

    </div>

  `;


  const url =

    API_URL +
    "?action=cari&q=" +
    encodeURIComponent(
      keyword
    );


  try {

    const response =
      await fetch(

        url,

        {

          method:
            "GET",

          cache:
            "no-store"

        }

      );


    if (!response.ok) {

      throw new Error(
        "HTTP Error " +
        response.status
      );

    }


    const text =
      await response.text();


    let data;


    try {

      data =
        JSON.parse(text);

    }

    catch (error) {

      throw new Error(
        "Server tidak mengirim JSON yang valid."
      );

    }


    console.log(
      "Data pencarian:",
      data
    );


    if (

      data.success === true &&
      data.jumlah > 0 &&
      Array.isArray(data.peserta)

    ) {

      // ===============================================
      // NORMALISASI SEMUA HASIL
      // ===============================================

      const pesertaNormal =
        data.peserta.map(
          function(peserta) {

            return normalisasiPeserta(
              peserta
            );

          }
        );


      tampilkanHasilPencarian(
        pesertaNormal
      );

    }

    else {

      hasil.innerHTML = `

        <div class="error">

          ❌ PESERTA TIDAK DITEMUKAN

          <br><br>

          ${
            escapeHTML(
              data.message ||
              "Tidak ada peserta yang cocok."
            )
          }

        </div>

      `;

    }

  }

  catch (error) {

    console.error(
      "Error pencarian:",
      error
    );


    hasil.innerHTML = `

      <div class="error">

        ❌ GAGAL MENGHUBUNGI SERVER

        <br><br>

        Silakan coba lagi.

      </div>

    `;

  }

  finally {

    sedangMencari =
      false;

  }

}


// =====================================================
// HASIL PENCARIAN
// =====================================================

function tampilkanHasilPencarian(
  pesertaList
) {

  const hasil =
    el("hasilPencarian");


  hasilPesertaManual =
    pesertaList;


  let html = `

    <div class="result-count">

      Ditemukan
      ${pesertaList.length}
      peserta

    </div>

  `;


  pesertaList.forEach(

    function(peserta, index) {

      const sudahRegistrasi =

        String(
          peserta.statusRegistrasi ||
          ""
        ).trim() ===
        "Sudah Registrasi";


      const nomorTampilan =

        sudahRegistrasi

          ? (
              peserta.nomor ||
              peserta.idPeserta ||
              "-"
            )

          : (
              peserta.idPeserta ||
              peserta.nomor ||
              "-"
            );


      html += `

        <div class="result-card">

          <div class="result-number">

            ${escapeHTML(
              nomorTampilan
            )}

          </div>


          <div class="result-name">

            ${escapeHTML(
              peserta.nama || "-"
            )}

          </div>


          <div class="result-detail">

            ID Peserta:
            ${escapeHTML(
              peserta.idPeserta || "-"
            )}

            <br>

            Nomor Peserta:
            ${escapeHTML(
              peserta.nomor ||
              "Belum ditentukan"
            )}

            <br>

            Usia:
            ${escapeHTML(
              peserta.usia || "-"
            )}

            <br>

            Kategori:
            ${escapeHTML(
              peserta.kategori || "-"
            )}

            <br>

            Status Pembayaran:
            ${escapeHTML(
              peserta.statusPembayaran || "-"
            )}

            <br>

            Status Registrasi:
            ${escapeHTML(
              peserta.statusRegistrasi || "-"
            )}

          </div>


          <button
            class="choose-button"
            type="button"
            data-index="${index}">

            👤 PILIH PESERTA

          </button>

        </div>

      `;

    }

  );


  hasil.innerHTML =
    html;


  const tombolPilih =
    hasil.querySelectorAll(
      ".choose-button"
    );


  tombolPilih.forEach(

    function(button) {

      button.addEventListener(

        "click",

        function() {

          const index =
            Number(
              button.dataset.index
            );


          pilihPesertaDariIndex(
            index
          );

        }

      );

    }

  );

}


// =====================================================
// PILIH PESERTA INDEX
// =====================================================

function pilihPesertaDariIndex(
  index
) {

  if (
    !Array.isArray(
      hasilPesertaManual
    )
  ) {

    return;

  }


  if (
    !hasilPesertaManual[index]
  ) {

    return;

  }


  pilihPeserta(
    hasilPesertaManual[index]
  );

}


// =====================================================
// PILIH PESERTA
// =====================================================

function pilihPeserta(
  peserta
) {

  peserta =
    normalisasiPeserta(
      peserta
    );


  idPesertaAktif =
    String(
      peserta.idPeserta ||
      ""
    ).trim();


  nomorPesertaHasilRegistrasi =
    String(
      peserta.nomor ||
      ""
    ).trim();


  if (!idPesertaAktif) {

    alert(
      "ID Peserta tidak ditemukan pada data peserta."
    );

    return;

  }


  el("pencarian").style.display =
    "none";

  el("hasil").style.display =
    "block";


  tampilkanPeserta(
    peserta
  );

}


// =====================================================
// TAMPILKAN PESERTA
// =====================================================

function tampilkanPeserta(
  peserta
) {

  peserta =
    normalisasiPeserta(
      peserta
    );


  const hasil =
    el("hasil");


  hasil.style.display =
    "block";


  const idPeserta =

    String(
      peserta.idPeserta ||
      idPesertaAktif ||
      ""
    ).trim();


  const nomorPeserta =

    String(
      peserta.nomor ||
      ""
    ).trim();


  const statusPembayaran =

    String(
      peserta.statusPembayaran ||
      ""
    ).trim();


  const statusRegistrasi =

    String(
      peserta.statusRegistrasi ||
      ""
    ).trim();


  const sudahRegistrasi =

    statusRegistrasi ===
    "Sudah Registrasi";


  const pembayaranLunas =

    statusPembayaran.toLowerCase() ===
    "lunas";


  if (idPeserta) {

    idPesertaAktif =
      idPeserta;

  }


  let kelasPembayaran =
    "status-belum";


  if (pembayaranLunas) {

    kelasPembayaran =
      "status-lunas";

  }


  let kelasRegistrasi =
    "status-belum";


  if (sudahRegistrasi) {

    kelasRegistrasi =
      "status-sudah";

  }


  let nomorUtamaHTML =
    "";


  if (
    sudahRegistrasi &&
    nomorPeserta
  ) {

    nomorUtamaHTML = `

      <div class="nomor-registrasi">

        <div class="nomor-registrasi-label">

          Nomor Peserta

        </div>

        <div class="nomor-registrasi-value">

          ${escapeHTML(
            nomorPeserta
          )}

        </div>

      </div>

    `;

  }

  else {

    nomorUtamaHTML = `

      <div class="nomor-label">

        ID Peserta

      </div>

      <div class="nomor">

        ${escapeHTML(
          idPeserta || "-"
        )}

      </div>

    `;

  }


  let tombolRegistrasi =
    "";


  if (sudahRegistrasi) {

    tombolRegistrasi = `

      <button
        id="registrasiButton"
        class="registrasi-button"
        type="button"
        disabled>

        ✅ REGISTRASI BERHASIL

      </button>

    `;

  }

  else if (!pembayaranLunas) {

    tombolRegistrasi = `

      <button
        id="registrasiButton"
        class="registrasi-button"
        type="button"
        disabled>

        🔒 PEMBAYARAN BELUM LUNAS

      </button>

    `;

  }

  else {

    tombolRegistrasi = `

      <button
        id="registrasiButton"
        class="registrasi-button"
        type="button">

        ✅ REGISTRASI PESERTA

      </button>

    `;

  }


  let waktuHTML =
    "";


  if (
    peserta.waktuRegistrasi
  ) {

    waktuHTML = `

      <div class="waktu">

        Waktu Registrasi:<br>

        <strong>

          ${escapeHTML(
            formatWaktu(
              peserta.waktuRegistrasi
            )
          )}

        </strong>

      </div>

    `;

  }


  hasil.innerHTML = `

    <div class="success">

      ✅ PESERTA DITEMUKAN

    </div>


    ${nomorUtamaHTML}


    <div class="data">


      ${
        !sudahRegistrasi && idPeserta

          ? `

            <div class="row">

              <div class="label">

                ID Peserta

              </div>

              <div class="value">

                ${escapeHTML(
                  idPeserta
                )}

              </div>

            </div>

          `

          : ""

      }


      <div class="row">

        <div class="label">

          Nama Peserta

        </div>

        <div class="value">

          ${escapeHTML(
            peserta.nama || "-"
          )}

        </div>

      </div>


      <div class="row">

        <div class="label">

          Usia

        </div>

        <div class="value">

          ${escapeHTML(
            peserta.usia || "-"
          )}

        </div>

      </div>


      <div class="row">

        <div class="label">

          Nama Orang Tua

        </div>

        <div class="value">

          ${escapeHTML(
            peserta.orangtua || "-"
          )}

        </div>

      </div>


      <div class="row">

        <div class="label">

          Kategori

        </div>

        <div class="value">

          ${escapeHTML(
            peserta.kategori || "-"
          )}

        </div>

      </div>


      <div class="row">

        <div class="label">

          Status Pembayaran

        </div>

        <div
          class="status ${kelasPembayaran}">

          ${escapeHTML(
            peserta.statusPembayaran || "-"
          )}

        </div>

      </div>


      <div class="row">

        <div class="label">

          Status Registrasi

        </div>

        <div
          id="statusRegistrasi"
          class="status ${kelasRegistrasi}">

          ${escapeHTML(
            peserta.statusRegistrasi || "-"
          )}

        </div>

      </div>


      ${waktuHTML}


      ${tombolRegistrasi}


      <button
        id="kembaliKeMenuDariHasil"
        class="secondary-button"
        type="button">

        ← KEMBALI KE MENU

      </button>


    </div>

  `;


  const tombolRegistrasiElement =
    el("registrasiButton");


  if (
    tombolRegistrasiElement &&
    !sudahRegistrasi &&
    pembayaranLunas
  ) {

    tombolRegistrasiElement
      .addEventListener(
        "click",
        registrasiPeserta
      );

  }


  const tombolKembali =
    el(
      "kembaliKeMenuDariHasil"
    );


  if (tombolKembali) {

    tombolKembali
      .addEventListener(
        "click",
        kembaliKeMenu
      );

  }

}

// =====================================================
// REGISTRASI PESERTA
// =====================================================
//
// API tetap menerima:
//
// MW46-001
//
// API membuat:
//
// A-001
//
// =====================================================

async function registrasiPeserta() {

  if (!idPesertaAktif) {

    alert(
      "ID Peserta tidak ditemukan."
    );

    return;

  }


  if (sedangRegistrasi) {

    return;

  }


  const button =
    el("registrasiButton");


  if (!button) {

    return;

  }


  sedangRegistrasi =
    true;


  button.disabled =
    true;


  button.textContent =
    "⏳ MEMPROSES...";


  try {

    const response =
      await fetch(

        API_URL +
        "?action=registrasi&nomor=" +
        encodeURIComponent(
          idPesertaAktif
        ),

        {

          method:
            "GET",

          cache:
            "no-store"

        }

      );


    if (!response.ok) {

      throw new Error(
        "HTTP Error " +
        response.status
      );

    }


    const data =
      await response.json();


    console.log(
      "Respons registrasi:",
      data
    );


    if (data.success) {

      nomorPesertaHasilRegistrasi =
        String(
          data.nomor ||
          ""
        ).trim();


      const status =
        el("statusRegistrasi");


      if (status) {

        status.textContent =
          "Sudah Registrasi";


        status.className =
          "status status-sudah";

      }


      const nomorLabel =
        document.querySelector(
          ".nomor-label"
        );


      const nomorElement =
        document.querySelector(
          ".nomor"
        );


      if (
        nomorLabel &&
        nomorElement
      ) {

        nomorLabel.outerHTML = `

          <div class="nomor-registrasi">

            <div class="nomor-registrasi-label">

              Nomor Peserta

            </div>

            <div class="nomor-registrasi-value">

              ${escapeHTML(
                nomorPesertaHasilRegistrasi
              )}

            </div>

          </div>

        `;


        nomorElement.remove();

      }


      const waktuBaru =
        formatWaktu(
          data.waktu
        );


      const waktuLama =
        document.querySelector(
          ".waktu"
        );


      if (waktuLama) {

        waktuLama.innerHTML = `

          Waktu Registrasi:<br>

          <strong>

            ${escapeHTML(
              waktuBaru
            )}

          </strong>

        `;

      }


      button.textContent =
        "✅ REGISTRASI BERHASIL";


      button.disabled =
        true;


      alert(

        "✅ REGISTRASI BERHASIL!\n\n" +

        "Nomor Peserta: " +
        (
          data.nomor ||
          "-"
        ) +

        "\nNama: " +
        (
          data.nama ||
          "-"
        ) +

        "\nWaktu: " +
        (
          waktuBaru ||
          "-"
        )

      );

    }


    else {

      if (
        data.sudahRegistrasi &&
        data.nomor
      ) {

        nomorPesertaHasilRegistrasi =
          String(
            data.nomor
          ).trim();


        button.textContent =
          "✅ REGISTRASI BERHASIL";


        button.disabled =
          true;


        const status =
          el("statusRegistrasi");


        if (status) {

          status.textContent =
            "Sudah Registrasi";


          status.className =
            "status status-sudah";

        }


        alert(

          "Peserta ini sudah melakukan registrasi.\n\n" +

          "Nomor Peserta: " +
          data.nomor

        );


        return;

      }


      button.disabled =
        false;


      button.textContent =
        "✅ REGISTRASI PESERTA";


      alert(

        "❌ REGISTRASI GAGAL\n\n" +

        (
          data.message ||
          "Terjadi kesalahan."
        )

      );

    }

  }

  catch (error) {

    console.error(
      "Error registrasi:",
      error
    );


    button.disabled =
      false;


    button.textContent =
      "✅ REGISTRASI PESERTA";


    alert(

      "❌ GAGAL MENGHUBUNGI SERVER\n\n" +

      "Silakan coba lagi."

    );

  }

  finally {

    sedangRegistrasi =
      false;

  }

}
