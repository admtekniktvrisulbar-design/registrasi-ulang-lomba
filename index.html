<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Registrasi Ulang Lomba</title>

  <!-- HTML5 QR CODE -->
  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      font-family: Arial, sans-serif;

      background: #f4f7fb;

      margin: 0;

      padding: 20px;

      text-align: center;

      color: #222;

    }

    .container {

      max-width: 500px;

      margin: auto;

    }

    h1 {

      color: #062b78;

      margin-bottom: 5px;

      font-size: 32px;

    }

    .subtitle {

      color: #555;

      margin-bottom: 25px;

      font-size: 18px;

      line-height: 1.4;

    }

    button {

      width: 100%;

      border: none;

      padding: 15px;

      border-radius: 10px;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      background: #0b3d91;

      color: white;

      margin-top: 10px;

    }

    button:disabled {

      background: #999;

      cursor: not-allowed;

    }

    #reader {

      background: white;

      padding: 10px;

      border-radius: 15px;

      margin-top: 20px;

      overflow: hidden;

    }

    #hasil {

      display: none;

      background: white;

      padding: 20px;

      border-radius: 15px;

      margin-top: 20px;

      box-shadow: 0 3px 12px rgba(0,0,0,0.12);

      text-align: left;

    }

    #pencarian {

      display: none;

      background: white;

      padding: 20px;

      border-radius: 15px;

      margin-top: 20px;

      box-shadow: 0 3px 12px rgba(0,0,0,0.12);

    }

    .search-input {

      width: 100%;

      padding: 14px;

      border: 1px solid #ccc;

      border-radius: 10px;

      font-size: 16px;

      margin-top: 10px;

      outline: none;

    }

    .search-input:focus {

      border-color: #0b3d91;

    }

    .search-button {

      background: #0b3d91;

    }

    .result-count {

      margin-top: 20px;

      font-weight: bold;

      color: #555;

      text-align: left;

    }

    .result-card {

      background: #f8f9fa;

      border: 1px solid #ddd;

      border-radius: 10px;

      padding: 15px;

      margin-top: 12px;

      text-align: left;

    }

    .result-number {

      color: #062b78;

      font-size: 20px;

      font-weight: bold;

    }

    .result-name {

      font-size: 17px;

      font-weight: bold;

      margin-top: 5px;

    }

    .result-detail {

      color: #666;

      margin-top: 7px;

      font-size: 14px;

      line-height: 1.5;

    }

    .choose-button {

      background: #198754;

      margin-top: 12px;

    }

    .success {

      background: #e8f8ed;

      border: 1px solid #54b86b;

      color: #176b2b;

      padding: 15px;

      border-radius: 10px;

      font-weight: bold;

      text-align: center;

      font-size: 18px;

    }

    .error {

      background: #fdeaea;

      border: 1px solid #e58b87;

      color: #9b1c18;

      padding: 15px;

      border-radius: 10px;

      font-weight: bold;

      text-align: center;

      margin-top: 10px;

      line-height: 1.5;

    }

    .nomor {

      font-size: 28px;

      margin: 20px 0;

      font-weight: bold;

      text-align: center;

      color: #062b78;

    }

    .data {

      margin-top: 15px;

    }

    .row {

      padding: 12px 0;

      border-bottom: 1px solid #eee;

    }

    .label {

      font-size: 14px;

      color: #777;

      margin-bottom: 4px;

    }

    .value {

      font-size: 18px;

      font-weight: bold;

      color: #222;

      line-height: 1.4;

    }

    .status {

      padding: 11px;

      border-radius: 8px;

      text-align: center;

      margin-top: 5px;

      font-weight: bold;

      font-size: 17px;

    }

    .status-lunas {

      background: #e8f8ed;

      color: #176b2b;

    }

    .status-belum {

      background: #fff4d6;

      color: #8a5a00;

    }

    .status-sudah {

      background: #e8f8ed;

      color: #176b2b;

    }

    .loading {

      text-align: center;

      padding: 20px;

      color: #555;

      font-weight: bold;

      line-height: 1.5;

    }

    .secondary-button {

      background: #555;

    }

    .registrasi-button {

      background: #198754;

      margin-top: 20px;

    }

    .waktu {

      text-align: center;

      margin-top: 15px;

      color: #555;

      font-size: 14px;

      line-height: 1.5;

    }

  </style>

</head>


<body>


<div class="container">


  <h1>
    REGISTRASI ULANG
  </h1>


  <div class="subtitle">

    Lomba Mewarnai &amp; Menggambar<br>

    TVRI Sulawesi Barat

  </div>


  <!-- =====================================================
       MENU UTAMA
       ===================================================== -->

  <div id="menuUtama">

    <button
      id="mulaiButton"
      onclick="mulaiScanner()">

      📷 MULAI SCAN QR CODE

    </button>


    <button
      class="secondary-button"
      onclick="bukaPencarian()">

      🔎 CARI PESERTA MANUAL

    </button>

  </div>


  <!-- =====================================================
       AREA KAMERA
       ===================================================== -->

  <div id="reader"></div>


  <!-- =====================================================
       AREA PENCARIAN MANUAL
       ===================================================== -->

  <div id="pencarian">

    <h2 style="color:#062b78; margin-top:0;">

      🔎 CARI PESERTA

    </h2>


    <div style="
      color:#666;
      margin-bottom:10px;
      line-height:1.5;
    ">

      Masukkan nama atau nomor peserta

    </div>


    <input
      id="inputPencarian"
      class="search-input"
      type="text"
      placeholder="Contoh: MG1012-001 atau Zaldy">


    <button
      class="search-button"
      onclick="cariManual()">

      🔎 CARI PESERTA

    </button>


    <div id="hasilPencarian"></div>


    <button
      class="secondary-button"
      onclick="kembaliKeMenu()">

      ← KEMBALI

    </button>

  </div>


  <!-- =====================================================
       HASIL PESERTA
       ===================================================== -->

  <div id="hasil"></div>


</div>



<script>


// =====================================================
// KONFIGURASI API
// =====================================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbyCnvBr41uRfF8FUt-ZmbeF1j7pcazsqBvnSVLkreITP1YYK7ZIvmwlhkFJA1Px9qso/exec";


// =====================================================
// VARIABEL
// =====================================================

let scanner = null;

let sudahScan = false;

let nomorPesertaAktif = "";


// =====================================================
// FORMAT WAKTU
// =====================================================

function formatWaktu(waktu) {

  if (!waktu) {

    return "";

  }


  try {

    const tanggal =
      new Date(waktu);


    if (isNaN(tanggal.getTime())) {

      return waktu;

    }


    return tanggal.toLocaleString(
      "id-ID",
      {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false,
        timeZone: "Asia/Makassar"
      }
    );

  }

  catch (error) {

    return waktu;

  }

}


// =====================================================
// MULAI SCANNER
// =====================================================

function mulaiScanner() {

  document.getElementById("menuUtama")
    .style.display = "none";


  document.getElementById("pencarian")
    .style.display = "none";


  document.getElementById("hasil")
    .style.display = "none";


  document.getElementById("hasil")
    .innerHTML = "";


  document.getElementById("reader")
    .innerHTML = "";


  sudahScan = false;

  nomorPesertaAktif = "";


  scanner =
    new Html5Qrcode("reader");


  const config = {

    fps: 10,

    qrbox: {

      width: 250,

      height: 250

    }

  };


  scanner.start(

    {
      facingMode: "environment"
    },

    config,

    onScanSuccess,

    onScanFailure

  )

  .catch(function(error) {

    console.error(
      "Kamera gagal:",
      error
    );


    document.getElementById("reader").innerHTML = `

      <div class="error">

        ❌ KAMERA TIDAK DAPAT DIAKSES

        <br><br>

        Pastikan izin kamera sudah diberikan.

        <br><br>

        ${error}

      </div>

    `;


    document.getElementById("menuUtama")
      .style.display = "block";

  });

}


// =====================================================
// QR BERHASIL DIBACA
// =====================================================

function onScanSuccess(
  decodedText,
  decodedResult
) {

  if (sudahScan) {

    return;

  }


  sudahScan = true;


  nomorPesertaAktif =
    decodedText.trim();


  console.log(
    "Nomor peserta aktif:",
    nomorPesertaAktif
  );


  if (scanner) {

    scanner.stop()

      .then(function() {

        console.log(
          "Scanner dihentikan."
        );

      })

      .catch(function(error) {

        console.log(
          "Gagal menghentikan scanner:",
          error
        );

      });

  }


  tampilkanLoading();


  cekPeserta(
    nomorPesertaAktif
  );

}


// =====================================================
// LOADING
// =====================================================

function tampilkanLoading() {

  const hasil =
    document.getElementById("hasil");


  hasil.style.display = "block";


  hasil.innerHTML = `

    <div class="loading">

      🔄 MENCARI DATA PESERTA...

      <br><br>

      Nomor QR:

      <strong>
        ${nomorPesertaAktif}
      </strong>

    </div>

  `;

}


// =====================================================
// CEK PESERTA DARI QR
// =====================================================

function cekPeserta(nomor) {

  fetch(

    API_URL +

    "?action=cek&nomor=" +

    encodeURIComponent(nomor)

  )

  .then(function(response) {

    if (!response.ok) {

      throw new Error(
        "HTTP Error " +
        response.status
      );

    }


    return response.json();

  })


  .then(function(data) {

    console.log(
      "Respons API QR:",
      data
    );


    if (
      data.success &&
      data.ditemukan
    ) {

      tampilkanPeserta(
        data.peserta
      );

    }

    else {

      tampilkanPesertaTidakDitemukan(
        data.message ||
        "Nomor peserta tidak ditemukan."
      );

    }

  })


  .catch(function(error) {

    console.error(
      "Error API QR:",
      error
    );


    tampilkanErrorAPI();

  });

}


// =====================================================
// BUKA PENCARIAN MANUAL
// =====================================================

function bukaPencarian() {

  document.getElementById("menuUtama")
    .style.display = "none";


  document.getElementById("reader")
    .innerHTML = "";


  document.getElementById("hasil")
    .style.display = "none";


  document.getElementById("hasil")
    .innerHTML = "";


  document.getElementById("pencarian")
    .style.display = "block";


  document.getElementById("hasilPencarian")
    .innerHTML = "";


  document.getElementById("inputPencarian")
    .value = "";


  setTimeout(function() {

    document.getElementById(
      "inputPencarian"
    ).focus();

  }, 100);

}


// =====================================================
// PENCARIAN MANUAL
// =====================================================

function cariManual() {

  const input =
    document.getElementById(
      "inputPencarian"
    );


  const keyword =
    input.value.trim();


  const hasil =
    document.getElementById(
      "hasilPencarian"
    );


  if (!keyword) {

    alert(
      "Masukkan nama atau nomor peserta."
    );

    input.focus();

    return;

  }


  hasil.innerHTML = `

    <div class="loading">

      🔄 MENCARI PESERTA...

      <br><br>

      Mohon tunggu...

    </div>

  `;


  const url =

    API_URL +

    "?action=cari&q=" +

    encodeURIComponent(keyword);


  console.log(
    "URL pencarian:",
    url
  );


  fetch(

    url,

    {
      method: "GET",
      cache: "no-store"
    }

  )


  .then(function(response) {

    console.log(
      "HTTP Status pencarian:",
      response.status
    );


    if (!response.ok) {

      throw new Error(
        "HTTP Error " +
        response.status
      );

    }


    return response.text();

  })


  .then(function(text) {

    console.log(
      "Response mentah pencarian:",
      text
    );


    let data;


    try {

      data =
        JSON.parse(text);

    }

    catch (error) {

      throw new Error(
        "Server tidak mengirim JSON yang valid."
      );

    }


    console.log(
      "Data JSON pencarian:",
      data
    );


    if (

      data.success === true &&

      data.jumlah > 0 &&

      Array.isArray(data.peserta)

    ) {

      tampilkanHasilPencarian(
        data.peserta
      );

    }

    else {

      hasil.innerHTML = `

        <div class="error">

          ❌ PESERTA TIDAK DITEMUKAN

          <br><br>

          ${
            data.message ||
            "Tidak ada peserta yang cocok."
          }

        </div>

      `;

    }

  })


  .catch(function(error) {

    console.error(
      "Error pencarian:",
      error
    );


    hasil.innerHTML = `

      <div class="error">

        ❌ GAGAL MENGHUBUNGI SERVER

        <br><br>

        ${error.message}

      </div>

    `;

  });

}


// =====================================================
// TAMPILKAN HASIL PENCARIAN
// =====================================================

function tampilkanHasilPencarian(
  pesertaList
) {

  const hasil =
    document.getElementById(
      "hasilPencarian"
    );


  let html = `

    <div class="result-count">

      Ditemukan ${pesertaList.length} peserta

    </div>

  `;


  pesertaList.forEach(function(peserta, index) {

    html += `

      <div class="result-card">

        <div class="result-number">

          ${peserta.nomor || "-"}

        </div>


        <div class="result-name">

          ${peserta.nama || "-"}

        </div>


        <div class="result-detail">

          Usia:
          ${peserta.usia || "-"}
          <br>

          Kategori:
          ${peserta.kategori || "-"}

        </div>


        <button
          class="choose-button"
          onclick="pilihPesertaDariIndex(${index})">

          👤 PILIH PESERTA

        </button>

      </div>

    `;

  });


  // Simpan daftar peserta agar
  // tidak perlu memasukkan object
  // langsung ke atribut onclick.

  window.hasilPesertaManual =
    pesertaList;


  hasil.innerHTML =
    html;

}


// =====================================================
// PILIH PESERTA DARI HASIL PENCARIAN
// =====================================================

function pilihPesertaDariIndex(index) {

  if (
    !window.hasilPesertaManual ||
    !window.hasilPesertaManual[index]
  ) {

    return;

  }


  const peserta =
    window.hasilPesertaManual[index];


  pilihPeserta(
    peserta
  );

}


// =====================================================
// PILIH PESERTA
// =====================================================

function pilihPeserta(peserta) {

  nomorPesertaAktif =
    String(
      peserta.nomor || ""
    ).trim();


  document.getElementById("pencarian")
    .style.display = "none";


  document.getElementById("hasil")
    .style.display = "block";


  tampilkanPeserta(
    peserta
  );

}


// =====================================================
// TAMPILKAN DATA PESERTA
// =====================================================

function tampilkanPeserta(
  peserta
) {

  const hasil =
    document.getElementById("hasil");


  hasil.style.display = "block";


  let kelasPembayaran =
    "status-belum";


  if (

    String(
      peserta.statusPembayaran
    ).trim() === "Lunas"

  ) {

    kelasPembayaran =
      "status-lunas";

  }


  let kelasRegistrasi =
    "status-belum";


  if (

    String(
      peserta.statusRegistrasi
    ).trim() ===
    "Sudah Registrasi"

  ) {

    kelasRegistrasi =
      "status-sudah";

  }


  const sudahRegistrasi =

    String(
      peserta.statusRegistrasi
    ).trim() ===
    "Sudah Registrasi";


  const pembayaranLunas =

    String(
      peserta.statusPembayaran
    ).trim() ===
    "Lunas";


  let tombolRegistrasi = "";


  if (sudahRegistrasi) {

    tombolRegistrasi = `

      <button
        class="registrasi-button"
        disabled>

        ✅ SUDAH REGISTRASI

      </button>

    `;

  }


  else if (!pembayaranLunas) {

    tombolRegistrasi = `

      <button
        class="registrasi-button"
        disabled>

        🔒 PEMBAYARAN BELUM LUNAS

      </button>

    `;

  }


  else {

    tombolRegistrasi = `

      <button
        id="registrasiButton"
        class="registrasi-button"
        onclick="registrasiPeserta()">

        ✅ REGISTRASI PESERTA

      </button>

    `;

  }


  let waktuHTML = "";


  if (peserta.waktuRegistrasi) {

    waktuHTML = `

      <div class="waktu">

        Waktu Registrasi:<br>

        <strong>
          ${formatWaktu(
            peserta.waktuRegistrasi
          )}
        </strong>

      </div>

    `;

  }


  hasil.innerHTML = `

    <div class="success">

      ✅ PESERTA DITEMUKAN

    </div>


    <div class="nomor">

      ${peserta.nomor || "-"}

    </div>


    <div class="data">


      <div class="row">

        <div class="label">
          Nama Peserta
        </div>

        <div class="value">
          ${peserta.nama || "-"}
        </div>

      </div>


      <div class="row">

        <div class="label">
          Usia
        </div>

        <div class="value">
          ${peserta.usia || "-"}
        </div>

      </div>


      <div class="row">

        <div class="label">
          Nama Orang Tua
        </div>

        <div class="value">
          ${peserta.orangtua || "-"}
        </div>

      </div>


      <div class="row">

        <div class="label">
          Kategori
        </div>

        <div class="value">
          ${peserta.kategori || "-"}
        </div>

      </div>


      <div class="row">

        <div class="label">
          Status Pembayaran
        </div>

        <div
          class="status ${kelasPembayaran}">

          ${peserta.statusPembayaran || "-"}

        </div>

      </div>


      <div class="row">

        <div class="label">
          Status Registrasi
        </div>

        <div
          id="statusRegistrasi"
          class="status ${kelasRegistrasi}">

          ${peserta.statusRegistrasi || "-"}

        </div>

      </div>


      ${waktuHTML}


      ${tombolRegistrasi}


      <button
        class="secondary-button"
        onclick="kembaliKeMenu()">

        ← KEMBALI KE MENU

      </button>


    </div>

  `;

}


// =====================================================
// PESERTA TIDAK DITEMUKAN
// =====================================================

function tampilkanPesertaTidakDitemukan(
  message
) {

  const hasil =
    document.getElementById("hasil");


  hasil.style.display =
    "block";


  hasil.innerHTML = `

    <div class="error">

      ❌ PESERTA TIDAK DITEMUKAN

    </div>


    <div class="nomor">

      ${nomorPesertaAktif}

    </div>


    <div style="
      text-align:center;
      margin-top:15px;
      color:#777;
    ">

      ${message}

    </div>


    <button
      class="secondary-button"
      onclick="kembaliKeMenu()">

      ← KEMBALI KE MENU

    </button>

  `;

}


// =====================================================
// ERROR API
// =====================================================

function tampilkanErrorAPI() {

  const hasil =
    document.getElementById("hasil");


  hasil.style.display =
    "block";


  hasil.innerHTML = `

    <div class="error">

      ❌ GAGAL MENGHUBUNGI SERVER

    </div>


    <div style="
      text-align:center;
      margin-top:15px;
    ">

      Nomor QR:

      <strong>
        ${nomorPesertaAktif}
      </strong>

      <br><br>

      Silakan coba lagi.

    </div>


    <button
      class="secondary-button"
      onclick="kembaliKeMenu()">

      ← KEMBALI KE MENU

    </button>

  `;

}


// =====================================================
// REGISTRASI PESERTA
// =====================================================

function registrasiPeserta() {

  if (!nomorPesertaAktif) {

    alert(
      "Nomor peserta tidak ditemukan."
    );

    return;

  }


  const button =
    document.getElementById(
      "registrasiButton"
    );


  if (!button) {

    return;

  }


  button.disabled = true;

  button.textContent =
    "⏳ MEMPROSES...";


  console.log(
    "Registrasi peserta:",
    nomorPesertaAktif
  );


  fetch(

    API_URL +

    "?action=registrasi&nomor=" +

    encodeURIComponent(
      nomorPesertaAktif
    )

  )


  .then(function(response) {

    if (!response.ok) {

      throw new Error(
        "HTTP Error " +
        response.status
      );

    }


    return response.json();

  })


  .then(function(data) {

    console.log(
      "Respons registrasi:",
      data
    );


    if (data.success) {


      const status =
        document.getElementById(
          "statusRegistrasi"
        );


      if (status) {

        status.textContent =
          "Sudah Registrasi";

        status.className =
          "status status-sudah";

      }


      button.textContent =
        "✅ REGISTRASI BERHASIL";


      button.disabled = true;


      const waktuBaru =
        formatWaktu(
          data.waktu
        );


      const waktuLama =
        document.querySelector(
          ".waktu"
        );


      if (waktuLama) {

        waktuLama.innerHTML = `

          Waktu Registrasi:<br>

          <strong>
            ${waktuBaru}
          </strong>

        `;

      }

      else {

        const dataContainer =
          document.querySelector(
            ".data"
          );


        if (dataContainer) {

          const div =
            document.createElement(
              "div"
            );


          div.className =
            "waktu";


          div.innerHTML = `

            Waktu Registrasi:<br>

            <strong>
              ${waktuBaru}
            </strong>

          `;


          dataContainer.insertBefore(
            div,
            button
          );

        }

      }


      alert(

        "✅ REGISTRASI BERHASIL!\n\n" +

        "Nomor Peserta: " +
        data.nomor +

        "\nNama: " +
        data.nama +

        "\nWaktu: " +
        waktuBaru

      );


    }

    else {


      button.disabled =
        false;


      button.textContent =
        "✅ REGISTRASI PESERTA";


      alert(

        "❌ REGISTRASI GAGAL\n\n" +

        (
          data.message ||
          "Terjadi kesalahan."
        )

      );

    }

  })


  .catch(function(error) {

    console.error(
      "Error registrasi:",
      error
    );


    button.disabled =
      false;


    button.textContent =
      "✅ REGISTRASI PESERTA";


    alert(

      "❌ GAGAL MENGHUBUNGI SERVER\n\n" +

      "Silakan coba lagi."

    );

  });

}

function kembaliKeMenu() {

  if (scanner) {

    scanner.stop()

      .catch(function() {});

    scanner = null;

  }


  document.getElementById(
    "reader"
  ).innerHTML = "";


  document.getElementById(
    "hasil"
  ).style.display = "none";


  document.getElementById(
    "hasil"
  ).innerHTML = "";


  document.getElementById(
    "pencarian"
  ).style.display = "none";


  document.getElementById(
    "hasilPencarian"
  ).innerHTML = "";


  document.getElementById(
    "menuUtama"
  ).style.display = "block";


  sudahScan = false;

  nomorPesertaAktif = "";

  window.hasilPesertaManual = [];

}
