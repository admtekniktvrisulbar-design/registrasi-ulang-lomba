<!DOCTYPE html>
<html lang="id">

<head>

  <base target="_top">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Registrasi Ulang</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      color: #062b78;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #555;
      margin-bottom: 20px;
    }

    #reader {
      background: white;
      padding: 10px;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 20px;
      text-align: left;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
      display: none;
    }

    .success {
      background: #e8f8ed;
      border: 1px solid #54b86b;
      color: #176b2b;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      text-align: center;
      font-weight: bold;
    }

    .warning {
      background: #fff4d6;
      border: 1px solid #e0a800;
      color: #765600;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      text-align: center;
      font-weight: bold;
    }

    .error {
      background: #fdeaea;
      border: 1px solid #d9534f;
      color: #9b1c18;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      text-align: center;
      font-weight: bold;
    }

    .row {
      margin-bottom: 12px;
    }

    .label {
      font-size: 12px;
      color: #777;
      margin-bottom: 3px;
    }

    .value {
      font-size: 17px;
      font-weight: bold;
      color: #222;
    }

    button {
      width: 100%;
      border: none;
      padding: 15px;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .register {
      background: #0b3d91;
      color: white;
    }

    .scan-again {
      background: #eeeeee;
      color: #333;
    }

    #loading {
      display: none;
      margin: 15px;
      color: #555;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>REGISTRASI ULANG</h1>

  <div class="subtitle">
    Lomba Mewarnai & Menggambar<br>
    TVRI Sulawesi Barat
  </div>

  <div id="reader"></div>

  <div id="loading">
    Memeriksa data peserta...
  </div>

  <div id="result" class="card"></div>

</div>


<script>

let pesertaNomor = null;


// =====================================================
// QR BERHASIL DIBACA
// =====================================================

function onScanSuccess(decodedText, decodedResult) {

  // Hentikan scanner sementara
  html5QrcodeScanner.clear();

  pesertaNomor = decodedText.trim();

  document.getElementById("loading").style.display = "block";

  google.script.run
    .withSuccessHandler(tampilkanPeserta)
    .withFailureHandler(tampilkanError)
    .cariPeserta(pesertaNomor);

}


// =====================================================
// TAMPILKAN DATA PESERTA
// =====================================================

function tampilkanPeserta(data) {

  document.getElementById("loading").style.display = "none";

  const result = document.getElementById("result");

  result.style.display = "block";


  if (!data.ditemukan) {

    result.innerHTML = `

      <div class="error">
        ❌ PESERTA TIDAK DITEMUKAN
      </div>

      <p>
        QR Code tidak cocok dengan data peserta.
      </p>

      <button class="scan-again"
              onclick="scanLagi()">
        SCAN LAGI
      </button>

    `;

    return;
  }


  if (data.statusPembayaran !== "Lunas") {

    result.innerHTML = `

      <div class="warning">
        ⚠️ PEMBAYARAN BELUM LUNAS
      </div>

      <div class="row">
        <div class="label">Nomor Peserta</div>
        <div class="value">${data.nomor}</div>
      </div>

      <div class="row">
        <div class="label">Nama Peserta</div>
        <div class="value">${data.nama}</div>
      </div>

      <button class="scan-again"
              onclick="scanLagi()">
        SCAN PESERTA LAIN
      </button>

    `;

    return;
  }


  if (data.statusRegistrasi === "Sudah Registrasi") {

    result.innerHTML = `

      <div class="warning">
        ⚠️ PESERTA SUDAH REGISTRASI
      </div>

      <div class="row">
        <div class="label">Nomor Peserta</div>
        <div class="value">${data.nomor}</div>
      </div>

      <div class="row">
        <div class="label">Nama Peserta</div>
        <div class="value">${data.nama}</div>
      </div>

      <div class="row">
        <div class="label">Kategori</div>
        <div class="value">${data.kategori}</div>
      </div>

      <div class="row">
        <div class="label">Nama Orang Tua</div>
        <div class="value">${data.orangtua}</div>
      </div>

      <button class="scan-again"
              onclick="scanLagi()">
        SCAN PESERTA LAIN
      </button>

    `;

    return;
  }


  // ===================================================
  // PESERTA SIAP REGISTRASI
  // ===================================================

  result.innerHTML = `

    <div class="success">
      ✅ PESERTA DITEMUKAN
    </div>

    <div class="row">
      <div class="label">Nomor Peserta</div>
      <div class="value">${data.nomor}</div>
    </div>

    <div class="row">
      <div class="label">Nama Peserta</div>
      <div class="value">${data.nama}</div>
    </div>

    <div class="row">
      <div class="label">Kategori</div>
      <div class="value">${data.kategori}</div>
    </div>

    <div class="row">
      <div class="label">Nama Orang Tua</div>
      <div class="value">${data.orangtua}</div>
    </div>

    <div class="row">
      <div class="label">Status Pembayaran</div>
      <div class="value">LUNAS</div>
    </div>

    <div class="row">
      <div class="label">Status Registrasi</div>
      <div class="value">BELUM REGISTRASI</div>
    </div>

    <button class="register"
            onclick="registrasikan()">
      ✅ REGISTRASI PESERTA
    </button>

    <button class="scan-again"
            onclick="scanLagi()">
      BATAL / SCAN LAIN
    </button>

  `;

}


// =====================================================
// TOMBOL REGISTRASI
// =====================================================

function registrasikan() {

  document.getElementById("loading").style.display = "block";

  google.script.run
    .withSuccessHandler(registrasiBerhasil)
    .withFailureHandler(tampilkanError)
    .registrasiPeserta(pesertaNomor);

}


// =====================================================
// REGISTRASI BERHASIL
// =====================================================

function registrasiBerhasil(data) {

  document.getElementById("loading").style.display = "none";

  const result = document.getElementById("result");

  result.innerHTML = `

    <div class="success">
      🎉 REGISTRASI BERHASIL
    </div>

    <div class="row">
      <div class="label">Nomor Peserta</div>
      <div class="value">${data.nomor}</div>
    </div>

    <div class="row">
      <div class="label">Nama Peserta</div>
      <div class="value">${data.nama}</div>
    </div>

    <div class="row">
      <div class="label">Waktu Registrasi</div>
      <div class="value">${data.waktu}</div>
    </div>

    <button class="scan-again"
            onclick="scanLagi()">
      📷 SCAN PESERTA BERIKUTNYA
    </button>

  `;

}


// =====================================================
// ERROR
// =====================================================

function tampilkanError(error) {

  document.getElementById("loading").style.display = "none";

  const result = document.getElementById("result");

  result.style.display = "block";

  result.innerHTML = `

    <div class="error">
      ❌ TERJADI KESALAHAN
    </div>

    <p>${error.message}</p>

    <button class="scan-again"
            onclick="scanLagi()">
      COBA LAGI
    </button>

  `;

}


// =====================================================
// SCAN ULANG
// =====================================================

function scanLagi() {

  document.getElementById("result").style.display = "none";

  pesertaNomor = null;

  mulaiScanner();

}


// =====================================================
// MULAI SCANNER
// =====================================================

let html5QrcodeScanner;


function mulaiScanner() {

  html5QrcodeScanner =
    new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },
      false
    );


  html5QrcodeScanner.render(
    onScanSuccess
  );

}


// Jalankan scanner saat halaman dibuka

mulaiScanner();

</script>

</body>

</html>
