<body>


<div class="container">


  <!-- =====================================================
       JUDUL
       ===================================================== -->

  <h1>
    REGISTRASI ULANG
  </h1>


  <div class="subtitle">

    Lomba Mewarnai &amp; Menggambar<br>

    TVRI Sulawesi Barat

  </div>


  <!-- =====================================================
       MENU UTAMA
       ===================================================== -->

  <div id="menuUtama">


    <button
      id="mulaiButton"
      type="button">

      📷 MULAI SCAN QR CODE

    </button>


    <button
      id="cariManualButton"
      class="secondary-button"
      type="button">

      🔎 CARI PESERTA MANUAL

    </button>


  </div>


  <!-- =====================================================
       AREA KAMERA
       ===================================================== -->

  <div id="reader"></div>


  <!-- =====================================================
       AREA PENCARIAN
       ===================================================== -->

  <div id="pencarian">


    <h2
      style="
        color:#062b78;
        margin-top:0;
      ">

      🔎 CARI PESERTA

    </h2>


    <div
      style="
        color:#666;
        margin-bottom:10px;
        line-height:1.5;
      ">

      Masukkan ID Peserta, nomor peserta,
      atau nama peserta

    </div>


    <input
      id="inputPencarian"
      class="search-input"
      type="text"
      placeholder="Contoh: MW46-001 atau Annisa">

      id="searchButton"

      type="button">

      🔎 CARI PESERTA

    </button>


    <div id="hasilPencarian"></div>


    <button
      id="kembaliDariPencarianButton"
      class="secondary-button"
      type="button">

      ← KEMBALI

    </button>

  <!-- =====================================================
       HASIL PESERTA
       ===================================================== -->

  <div id="hasil"></div>


</div>



<script>


// =====================================================
// KONFIGURASI API
// =====================================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbyCnvBr41uRfF8FUt-ZmbeF1j7pcazsqBvnSVLkreITP1YYK7ZIvmwlhkFJA1Px9qso/exec";


// =====================================================
// VARIABEL GLOBAL
// =====================================================

let scanner = null;

let sudahScan = false;


// =====================================================
// PENTING
// =====================================================
//
// Variabel ini SELALU menyimpan ID PESERTA.
//
// Contoh:
// MW46-001
//
// BUKAN nomor peserta hasil registrasi.
//
// Nomor peserta seperti A-001 hanya digunakan
// setelah API mengembalikannya ketika registrasi
// berhasil.
// =====================================================

let idPesertaAktif = "";


let nomorPesertaHasilRegistrasi = "";

let hasilPesertaManual = [];

let sedangMencari = false;

let sedangRegistrasi = false;


// =====================================================
// HELPER ELEMENT
// =====================================================

function el(id) {

  return document.getElementById(id);

}


// =====================================================
// ESCAPE HTML
// =====================================================
//
// Mencegah data dari spreadsheet merusak HTML.
// =====================================================

function escapeHTML(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


// =====================================================
// FORMAT WAKTU
// =====================================================

function formatWaktu(waktu) {

  if (
    waktu === null ||
    waktu === undefined ||
    waktu === ""
  ) {

    return "";

  }


  try {

    let tanggal;


    // ===================================================
    // 1. OBJECT DATE
    // ===================================================

    if (
      waktu instanceof Date
    ) {

      tanggal =
        waktu;

    }


    // ===================================================
    // 2. ANGKA
    // ===================================================

    else if (
      typeof waktu === "number"
    ) {

      if (
        waktu > 100000000000
      ) {

        tanggal =
          new Date(waktu);

      }

      else if (
        waktu > 1000000000
      ) {

        tanggal =
          new Date(
            waktu * 1000
          );

      }

      else {

        tanggal =
          new Date(
            (
              waktu - 25569
            ) *
            86400000
          );

      }

    }


    // ===================================================
    // 3. STRING
    // ===================================================

    else {

      const nilai =
        String(waktu).trim();


      // ISO

      if (
        /^\d{4}-\d{2}-\d{2}T/.test(
          nilai
        )
      ) {

        tanggal =
          new Date(nilai);

      }


      // YYYY-MM-DD HH:mm:ss

      else if (
        /^\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}/.test(
          nilai
        )
      ) {

        const bagian =
          nilai.split(/\s+/);

        const tanggalBagian =
          bagian[0].split("-");

        const waktuBagian =
          (
            bagian[1] ||
            "00:00:00"
          ).split(":");


        tanggal =
          new Date(

            Number(
              tanggalBagian[0]
            ),

            Number(
              tanggalBagian[1]
            ) - 1,

            Number(
              tanggalBagian[2]
            ),

            Number(
              waktuBagian[0]
            ),

            Number(
              waktuBagian[1]
            ),

            Number(
              waktuBagian[2] || 0
            )

          );

      }


      // DD/MM/YYYY HH:mm:ss

      else if (
        /^\d{2}\/\d{2}\/\d{4}/.test(
          nilai
        )
      ) {

        const bersih =
          nilai.replace(
            ",",
            " "
          );


        const bagian =
          bersih.split(/\s+/);


        const tanggalBagian =
          bagian[0].split("/");


        const waktuBagian =
          (
            bagian[1] ||
            "00:00:00"
          ).split(":");


        tanggal =
          new Date(

            Number(
              tanggalBagian[2]
            ),

            Number(
              tanggalBagian[1]
            ) - 1,

            Number(
              tanggalBagian[0]
            ),

            Number(
              waktuBagian[0]
            ),

            Number(
              waktuBagian[1]
            ),

            Number(
              waktuBagian[2] || 0
            )

          );

      }


      else {

        tanggal =
          new Date(nilai);

      }

    }


    if (
      !tanggal ||
      isNaN(
        tanggal.getTime()
      )
    ) {

      console.warn(
        "Format waktu tidak dikenali:",
        waktu
      );

      return String(waktu);

    }


    return tanggal.toLocaleString(

      "id-ID",

      {

        day:
          "2-digit",

        month:
          "2-digit",

        year:
          "numeric",

        hour:
          "2-digit",

        minute:
          "2-digit",

        second:
          "2-digit",

        hour12:
          false,

        timeZone:
          "Asia/Makassar"

      }

    );

  }

  catch (error) {

    console.error(
      "Gagal memformat waktu:",
      waktu,
      error
    );


    return String(waktu);

  }

}


// =====================================================
// HENTIKAN SCANNER
// =====================================================

async function hentikanScanner() {

  if (!scanner) {

    return;

  }


  const scannerYangDihentikan =
    scanner;


  scanner =
    null;


  try {

    await scannerYangDihentikan.stop();

  }

  catch (error) {

    console.log(
      "Scanner sudah berhenti:",
      error
    );

  }


  try {

    await scannerYangDihentikan.clear();

  }

  catch (error) {

    console.log(
      "Reader sudah dibersihkan:",
      error
    );

  }

}


// =====================================================
// RESET TAMPILAN
// =====================================================

function resetTampilan() {

  el("reader").innerHTML =
    "";

  el("hasil").innerHTML =
    "";

  el("hasilPencarian").innerHTML =
    "";


  el("reader").style.display =
    "none";

  el("hasil").style.display =
    "none";

  el("pencarian").style.display =
    "none";

  el("menuUtama").style.display =
    "block";


  el("inputPencarian").value =
    "";


  hasilPesertaManual =
    [];

  idPesertaAktif =
    "";

  nomorPesertaHasilRegistrasi =
    "";

  sudahScan =
    false;

  sedangMencari =
    false;

  sedangRegistrasi =
    false;

}


// =====================================================
// KEMBALI KE MENU
// =====================================================

async function kembaliKeMenu() {

  if (
    sedangRegistrasi
  ) {

    return;

  }


  await hentikanScanner();


  el("reader").innerHTML =
    "";

  el("hasil").innerHTML =
    "";

  el("hasilPencarian").innerHTML =
    "";


  el("reader").style.display =
    "none";

  el("hasil").style.display =
    "none";

  el("pencarian").style.display =
    "none";


  el("menuUtama").style.display =
    "block";


  sudahScan =
    false;

  idPesertaAktif =
    "";

  nomorPesertaHasilRegistrasi =
    "";

  hasilPesertaManual =
    [];

  sedangMencari =
    false;


  el("mulaiButton").disabled =
    false;

  el("cariManualButton").disabled =
    false;

}


// =====================================================
// BUKA PENCARIAN MANUAL
// =====================================================

async function bukaPencarian() {

  await hentikanScanner();


  el("menuUtama").style.display =
    "none";

  el("reader").style.display =
    "none";

  el("reader").innerHTML =
    "";

  el("hasil").style.display =
    "none";

  el("hasil").innerHTML =
    "";

  el("pencarian").style.display =
    "block";

  el("hasilPencarian").innerHTML =
    "";

  el("inputPencarian").value =
    "";


  idPesertaAktif =
    "";

  nomorPesertaHasilRegistrasi =
    "";

  sudahScan =
    false;


  setTimeout(
    function() {

      el("inputPencarian").focus();

    },
    100
  );

}


// =====================================================
// MULAI SCANNER
// =====================================================

async function mulaiScanner() {

  await hentikanScanner();


  el("menuUtama").style.display =
    "none";

  el("pencarian").style.display =
    "none";

  el("hasil").style.display =
    "none";

  el("hasil").innerHTML =
    "";

  el("reader").innerHTML =
    "";

  el("reader").style.display =
    "block";


  sudahScan =
    false;

  idPesertaAktif =
    "";

  nomorPesertaHasilRegistrasi =
    "";


  scanner =
    new Html5Qrcode(
      "reader"
    );


  const config = {

    fps:
      10,

    qrbox: {

      width:
        250,

      height:
        250

    }

  };


  try {

    await scanner.start(

      {
        facingMode:
          "environment"
      },

      config,

      onScanSuccess,

      onScanFailure

    );


    console.log(
      "Kamera berhasil dimulai."
    );

  }

  catch (error) {

    console.error(
      "Kamera gagal:",
      error
    );


    el("reader").innerHTML = `

      <div class="error">

        ❌ KAMERA TIDAK DAPAT DIAKSES

        <br><br>

        Pastikan izin kamera
        sudah diberikan.

        <br><br>

        ${escapeHTML(error)}

      </div>

    `;


    el("menuUtama").style.display =
      "block";

  }

}


// =====================================================
// QR BERHASIL DIBACA
// =====================================================

async function onScanSuccess(
  decodedText,
  decodedResult
) {

  if (sudahScan) {

    return;

  }


  sudahScan =
    true;


  // ===================================================
  // QR BERISI ID PESERTA
  // ===================================================

  idPesertaAktif =
    String(
      decodedText
    ).trim();


  console.log(
    "ID Peserta dari QR:",
    idPesertaAktif
  );


  await hentikanScanner();


  tampilkanLoading();


  cekPeserta(
    idPesertaAktif
  );

}


// =====================================================
// QR GAGAL
// =====================================================

function onScanFailure(error) {

  // Tidak perlu menampilkan error.

}


// =====================================================
// LOADING
// =====================================================

function tampilkanLoading() {

  const hasil =
    el("hasil");


  hasil.style.display =
    "block";


  hasil.innerHTML = `

    <div class="loading">

      🔄 MENCARI DATA PESERTA...

      <br><br>

      ID Peserta:

      <strong>

        ${escapeHTML(
          idPesertaAktif
        )}

      </strong>

      <br><br>

      Mohon tunggu...

    </div>

  `;

}


// =====================================================
// CEK PESERTA
// =====================================================

function cekPeserta(idPeserta) {

  fetch(

    API_URL +
    "?action=cek&nomor=" +
    encodeURIComponent(
      idPeserta
    ),

    {

      method:
        "GET",

      cache:
        "no-store"

    }

  )

  .then(
    function(response) {

      if (!response.ok) {

        throw new Error(
          "HTTP Error " +
          response.status
        );

      }


      return response.json();

    }
  )

  .then(
    function(data) {

      console.log(
        "Respons API:",
        data
      );


      if (

        data.success &&
        data.ditemukan &&
        data.peserta

      ) {

        // =============================================
        // PASTIKAN ID PESERTA AKTIF
        // =============================================

        idPesertaAktif =
          String(
            data.peserta.idPeserta ||
            idPesertaAktif
          ).trim();


        tampilkanPeserta(
          data.peserta
        );

      }

      else {

        tampilkanPesertaTidakDitemukan(

          data.message ||
          "ID Peserta tidak ditemukan."

        );

      }

    }
  )

  .catch(
    function(error) {

      console.error(
        "Error API:",
        error
      );


      tampilkanErrorAPI();

    }
  );

}


// =====================================================
// PENCARIAN MANUAL
// =====================================================

async function cariManual() {

  if (sedangMencari) {

    return;

  }


  const input =
    el("inputPencarian");


  const keyword =
    input.value.trim();


  const hasil =
    el("hasilPencarian");


  if (!keyword) {

    alert(
      "Masukkan ID Peserta, nomor peserta, atau nama peserta."
    );


    input.focus();

    return;

  }


  sedangMencari =
    true;


  hasil.innerHTML = `

    <div class="loading">

      🔄 MENCARI PESERTA...

      <br><br>

      Mohon tunggu...

    </div>

  `;


  const url =

    API_URL +
    "?action=cari&q=" +
    encodeURIComponent(
      keyword
    );


  try {

    const response =
      await fetch(

        url,

        {

          method:
            "GET",

          cache:
            "no-store"

        }

      );


    if (!response.ok) {

      throw new Error(
        "HTTP Error " +
        response.status
      );

    }


    const text =
      await response.text();


    let data;


    try {

      data =
        JSON.parse(text);

    }

    catch (error) {

      throw new Error(
        "Server tidak mengirim JSON yang valid."
      );

    }


    console.log(
      "Data pencarian:",
      data
    );


    if (

      data.success === true &&
      data.jumlah > 0 &&
      Array.isArray(data.peserta)

    ) {

      tampilkanHasilPencarian(
        data.peserta
      );

    }

    else {

      hasil.innerHTML = `

        <div class="error">

          ❌ PESERTA TIDAK DITEMUKAN

          <br><br>

          ${
            escapeHTML(
              data.message ||
              "Tidak ada peserta yang cocok."
            )
          }

        </div>

      `;

    }

  }

  catch (error) {

    console.error(
      "Error pencarian:",
      error
    );


    hasil.innerHTML = `

      <div class="error">

        ❌ GAGAL MENGHUBUNGI SERVER

        <br><br>

        Silakan coba lagi.

      </div>

    `;

  }

  finally {

    sedangMencari =
      false;

  }

}


// =====================================================
// TAMPILKAN HASIL PENCARIAN
// =====================================================

function tampilkanHasilPencarian(
  pesertaList
) {

  const hasil =
    el("hasilPencarian");


  hasilPesertaManual =
    pesertaList;


  let html = `

    <div class="result-count">

      Ditemukan
      ${pesertaList.length}
      peserta

    </div>

  `;


  pesertaList.forEach(

    function(peserta, index) {

      // ===============================================
      // TENTUKAN NOMOR YANG DITAMPILKAN
      // ===============================================
      //
      // Jika sudah registrasi:
      // tampilkan Nomor Peserta.
      //
      // Jika belum:
      // tampilkan ID Peserta.
      // ===============================================

      const sudahRegistrasi =

        String(
          peserta.statusRegistrasi || ""
        ).trim() ===
        "Sudah Registrasi";


      const nomorTampilan =

        sudahRegistrasi

          ? (
              peserta.nomor ||
              peserta.idPeserta ||
              "-"
            )

          : (
              peserta.idPeserta ||
              peserta.nomor ||
              "-"
            );


      html += `

        <div class="result-card">

          <div class="result-number">

            ${escapeHTML(
              nomorTampilan
            )}

          </div>


          <div class="result-name">

            ${escapeHTML(
              peserta.nama || "-"
            )}

          </div>


          <div class="result-detail">

            ID Peserta:
            ${escapeHTML(
              peserta.idPeserta || "-"
            )}

            <br>

            Nomor Peserta:
            ${escapeHTML(
              peserta.nomor || "Belum ditentukan"
            )}

            <br>

            Usia:
            ${escapeHTML(
              peserta.usia || "-"
            )}

            <br>

            Kategori:
            ${escapeHTML(
              peserta.kategori || "-"
            )}

            <br>

            Status:
            ${escapeHTML(
              peserta.statusRegistrasi || "-"
            )}

          </div>


          <button
            class="choose-button"
            type="button"
            data-index="${index}">

            👤 PILIH PESERTA

          </button>

        </div>

      `;

    }

  );


  hasil.innerHTML =
    html;


  const tombolPilih =
    hasil.querySelectorAll(
      ".choose-button"
    );


  tombolPilih.forEach(

    function(button) {

      button.addEventListener(

        "click",

        function() {

          const index =
            Number(
              button.dataset.index
            );


          pilihPesertaDariIndex(
            index
          );

        }

      );

    }

  );

}


// =====================================================
// PILIH PESERTA DARI HASIL PENCARIAN
// =====================================================

function pilihPesertaDariIndex(
  index
) {

  if (
    !Array.isArray(
      hasilPesertaManual
    )
  ) {

    return;

  }


  if (
    !hasilPesertaManual[index]
  ) {

    return;

  }


  const peserta =
    hasilPesertaManual[index];


  pilihPeserta(
    peserta
  );

}


// =====================================================
// PILIH PESERTA
// =====================================================

function pilihPeserta(
  peserta
) {

  // ===================================================
  // SANGAT PENTING:
  // Yang disimpan sebagai ID AKTIF adalah ID Peserta.
  //
  // Bukan nomor peserta A-001.
  // ===================================================

  idPesertaAktif =
    String(
      peserta.idPeserta ||
      ""
    ).trim();


  // Jika API lama/hasil tertentu tidak memiliki
  // idPeserta, gunakan nomor sebagai fallback.

  if (!idPesertaAktif) {

    idPesertaAktif =
      String(
        peserta.nomor ||
        ""
      ).trim();

  }


  nomorPesertaHasilRegistrasi =
    String(
      peserta.nomor ||
      ""
    ).trim();


  el("pencarian").style.display =
    "none";


  el("hasil").style.display =
    "block";


  tampilkanPeserta(
    peserta
  );

}


// =====================================================
// TAMPILKAN DATA PESERTA
// =====================================================

function tampilkanPeserta(
  peserta
) {

  const hasil =
    el("hasil");


  hasil.style.display =
    "block";


  // ===================================================
  // DATA UTAMA
  // ===================================================

  const idPeserta =

    String(
      peserta.idPeserta ||
      idPesertaAktif ||
      ""
    ).trim();


  const nomorPeserta =

    String(
      peserta.nomor ||
      ""
    ).trim();


  const statusPembayaran =

    String(
      peserta.statusPembayaran ||
      ""
    ).trim();


  const statusRegistrasi =

    String(
      peserta.statusRegistrasi ||
      ""
    ).trim();


  const sudahRegistrasi =

    statusRegistrasi ===
    "Sudah Registrasi";


  const pembayaranLunas =

    statusPembayaran ===
    "Lunas";


  // ===================================================
  // PASTIKAN ID AKTIF
  // ===================================================

  if (idPeserta) {

    idPesertaAktif =
      idPeserta;

  }


  // ===================================================
  // STATUS PEMBAYARAN
  // ===================================================

  let kelasPembayaran =
    "status-belum";


  if (pembayaranLunas) {

    kelasPembayaran =
      "status-lunas";

  }


  // ===================================================
  // STATUS REGISTRASI
  // ===================================================

  let kelasRegistrasi =
    "status-belum";


  if (sudahRegistrasi) {

    kelasRegistrasi =
      "status-sudah";

  }


  // ===================================================
  // TAMPILAN NOMOR
  // ===================================================
  //
  // BELUM REGISTRASI:
  // tampilkan ID Peserta.
  //
  // SUDAH REGISTRASI:
  // tampilkan Nomor Peserta.
  // ===================================================

  let nomorUtamaHTML = "";


  if (sudahRegistrasi && nomorPeserta) {

    nomorUtamaHTML = `

      <div class="nomor-registrasi">

        <div class="nomor-registrasi-label">

          Nomor Peserta

        </div>

        <div class="nomor-registrasi-value">

          ${escapeHTML(
            nomorPeserta
          )}

        </div>

      </div>

    `;

  }

  else {

    nomorUtamaHTML = `

      <div class="nomor-label">

        ID Peserta

      </div>

      <div class="nomor">

        ${escapeHTML(
          idPeserta || "-"
        )}

      </div>

    `;

  }


  // ===================================================
  // TOMBOL REGISTRASI
  // ===================================================

  let tombolRegistrasi =
    "";


  if (sudahRegistrasi) {

    tombolRegistrasi = `

      <button
        id="registrasiButton"
        class="registrasi-button"
        type="button"
        disabled>

        ✅ REGISTRASI BERHASIL

      </button>

    `;

  }

  else if (!pembayaranLunas) {

    tombolRegistrasi = `

      <button
        id="registrasiButton"
        class="registrasi-button"
        type="button"
        disabled>

        🔒 PEMBAYARAN BELUM LUNAS

      </button>

    `;

  }

  else {

    tombolRegistrasi = `

      <button
        id="registrasiButton"
        class="registrasi-button"
        type="button">

        ✅ REGISTRASI PESERTA

      </button>

    `;

  }


  // ===================================================
  // WAKTU REGISTRASI
  // ===================================================

  let waktuHTML =
    "";


  if (
    peserta.waktuRegistrasi
  ) {

    waktuHTML = `

      <div class="waktu">

        Waktu Registrasi:<br>

        <strong>

          ${escapeHTML(
            formatWaktu(
              peserta.waktuRegistrasi
            )
          )}

        </strong>

      </div>

    `;

  }


  // ===================================================
  // DATA LENGKAP
  // ===================================================

  hasil.innerHTML = `

    <div class="success">

      ✅ PESERTA DITEMUKAN

    </div>


    ${nomorUtamaHTML}


    <div class="data">


      ${
        !sudahRegistrasi && idPeserta
          ? `
            <div class="row">

              <div class="label">

                ID Peserta

              </div>

              <div class="value">

                ${escapeHTML(
                  idPeserta
                )}

              </div>

            </div>
          `
          : ""
      }


      <div class="row">

        <div class="label">

          Nama Peserta

        </div>

        <div class="value">

          ${escapeHTML(
            peserta.nama || "-"
          )}

        </div>

      </div>


      <div class="row">

        <div class="label">

          Usia

        </div>

        <div class="value">

          ${escapeHTML(
            peserta.usia || "-"
          )}

        </div>

      </div>


      <div class="row">

        <div class="label">

          Nama Orang Tua

        </div>

        <div class="value">

          ${escapeHTML(
            peserta.orangtua || "-"
          )}

        </div>

      </div>


      <div class="row">

        <div class="label">

          Kategori

        </div>

        <div class="value">

          ${escapeHTML(
            peserta.kategori || "-"
          )}

        </div>

      </div>


      <div class="row">

        <div class="label">

          Status Pembayaran

        </div>

        <div
          class="status ${kelasPembayaran}">

          ${escapeHTML(
            peserta.statusPembayaran || "-"
          )}

        </div>

      </div>


      <div class="row">

        <div class="label">

          Status Registrasi

        </div>

        <div
          id="statusRegistrasi"
          class="status ${kelasRegistrasi}">

          ${escapeHTML(
            peserta.statusRegistrasi || "-"
          )}

        </div>

      </div>


      ${waktuHTML}


      ${tombolRegistrasi}


      <button
        id="kembaliKeMenuDariHasil"
        class="secondary-button"
        type="button">

        ← KEMBALI KE MENU

      </button>


    </div>

  `;


  // ===================================================
  // EVENT REGISTRASI
  // ===================================================

  const tombolRegistrasiElement =
    el("registrasiButton");


  if (
    tombolRegistrasiElement &&
    !sudahRegistrasi &&
    pembayaranLunas
  ) {

    tombolRegistrasiElement
      .addEventListener(
        "click",
        registrasiPeserta
      );

  }


  // ===================================================
  // EVENT KEMBALI
  // ===================================================

  const tombolKembali =
    el(
      "kembaliKeMenuDariHasil"
    );


  if (tombolKembali) {

    tombolKembali
      .addEventListener(
        "click",
        kembaliKeMenu
      );

  }

}

// PESERTA TIDAK DITEMUKAN

// =====================================================
// REGISTRASI PESERTA
// =====================================================
//
// PENTING:
//
// API menerima ID PESERTA.
//
// Contoh:
//
// MW46-001
//
// API kemudian membuat nomor:
//
// A-001
//
// Jadi kita TIDAK mengirim A-001 ke API.
// =====================================================

async function registrasiPeserta() {

  if (!idPesertaAktif) {

    alert(
      "ID Peserta tidak ditemukan."
    );

    return;

  }


  if (sedangRegistrasi) {

    return;

  }


  const button =
    el("registrasiButton");


  if (!button) {

    return;

  }


  sedangRegistrasi =
    true;


  button.disabled =
    true;


  button.textContent =
    "⏳ MEMPROSES...";


  console.log(
    "Registrasi menggunakan ID Peserta:",
    idPesertaAktif
  );


  try {

    const response =
      await fetch(

        API_URL +
        "?action=registrasi&nomor=" +
        encodeURIComponent(
          idPesertaAktif
        ),

        {

          method:
            "GET",

          cache:
            "no-store"

        }

      );


    if (!response.ok) {

      throw new Error(
        "HTTP Error " +
        response.status
      );

    }


    const data =
      await response.json();


    console.log(
      "Respons registrasi:",
      data
    );


    // =================================================
    // REGISTRASI BERHASIL
    // =================================================

    if (data.success) {


      // ===============================================
      // SIMPAN NOMOR BARU
      // ===============================================

      nomorPesertaHasilRegistrasi =
        String(
          data.nomor ||
          ""
        ).trim();


      // ===============================================
      // UPDATE STATUS
      // ===============================================

      const status =
        el("statusRegistrasi");


      if (status) {

        status.textContent =
          "Sudah Registrasi";


        status.className =
          "status status-sudah";

      }


      // ===============================================
      // UPDATE NOMOR UTAMA
      // ===============================================
      //
      // ID Peserta:
      // MW46-001
      //
      // berubah menjadi:
      // A-001
      // ===============================================

      const nomorLabel =
        document.querySelector(
          ".nomor-label"
        );


      const nomorElement =
        document.querySelector(
          ".nomor"
        );


      if (
        nomorLabel &&
        nomorElement
      ) {

        nomorLabel.outerHTML = `

          <div class="nomor-registrasi">

            <div class="nomor-registrasi-label">

              Nomor Peserta

            </div>

            <div class="nomor-registrasi-value">

              ${escapeHTML(
                nomorPesertaHasilRegistrasi
              )}

            </div>

          </div>

        `;


        nomorElement.remove();

      }

      else {

        // Jika struktur tampilan sudah berubah,
        // cari container data dan tambahkan nomor.

        const dataContainer =
          document.querySelector(
            ".data"
          );


        if (dataContainer) {

          const nomorBaruElement =
            document.createElement(
              "div"
            );


          nomorBaruElement.className =
            "nomor-registrasi";


          nomorBaruElement.innerHTML = `

            <div class="nomor-registrasi-label">

              Nomor Peserta

            </div>

            <div class="nomor-registrasi-value">

              ${escapeHTML(
                nomorPesertaHasilRegistrasi
              )}

            </div>

          `;


          dataContainer.prepend(
            nomorBaruElement
          );

        }

      }


      // ===============================================
      // UPDATE WAKTU
      // ===============================================

      const waktuBaru =
        formatWaktu(
          data.waktu
        );


      const waktuLama =
        document.querySelector(
          ".waktu"
        );


      if (waktuLama) {

        waktuLama.innerHTML = `

          Waktu Registrasi:<br>

          <strong>

            ${escapeHTML(
              waktuBaru
            )}

          </strong>

        `;

      }

      else {

        const dataContainer =
          document.querySelector(
            ".data"
          );


        if (dataContainer) {

          const div =
            document.createElement(
              "div"
            );


          div.className =
            "waktu";


          div.innerHTML = `

            Waktu Registrasi:<br>

            <strong>

              ${escapeHTML(
                waktuBaru
              )}

            </strong>

          `;


          dataContainer.insertBefore(
            div,
            button
          );

        }

      }


      // ===============================================
      // UPDATE BUTTON
      // ===============================================

      button.textContent =
        "✅ REGISTRASI BERHASIL";


      button.disabled =
        true;


      // ===============================================
      // ALERT
      // ===============================================

      alert(

        "✅ REGISTRASI BERHASIL!\n\n" +

        "Nomor Peserta: " +
        (
          data.nomor ||
          "-"
        ) +

        "\nNama: " +
        (
          data.nama ||
          "-"
        ) +

        "\nWaktu: " +
        (
          waktuBaru ||
          "-"
        )

      );


      // ===============================================
      // PENTING:
      // idPesertaAktif TETAP ID PESERTA
      // ===============================================
      //
      // Kita sengaja TIDAK mengubah:
      //
      // idPesertaAktif = data.nomor
      //
      // karena jika panitia melakukan proses lain
      // atau API dipanggil kembali, identitas peserta
      // tetap harus menggunakan ID Peserta.
      // ===============================================

    }


    // =================================================
    // REGISTRASI GAGAL
    // =================================================

    else {

      // -----------------------------------------------
      // Jika sebenarnya sudah terdaftar
      // -----------------------------------------------

      if (
        data.sudahRegistrasi &&
        data.nomor
      ) {

        nomorPesertaHasilRegistrasi =
          String(
            data.nomor
          ).trim();


        button.textContent =
          "✅ REGISTRASI BERHASIL";


        button.disabled =
          true;


        const status =
          el("statusRegistrasi");


        if (status) {

          status.textContent =
            "Sudah Registrasi";


          status.className =
            "status status-sudah";

        }


        alert(

          "Peserta ini sudah melakukan registrasi.\n\n" +

          "Nomor Peserta: " +
          data.nomor

        );


        return;

      }


      button.disabled =
        false;


      button.textContent =
        "✅ REGISTRASI PESERTA";


      alert(

        "❌ REGISTRASI GAGAL\n\n" +

        (
          data.message ||
          "Terjadi kesalahan."
        )

      );

    }

  }

  catch (error) {

    console.error(
      "Error registrasi:",
      error
    );


    button.disabled =
      false;


    button.textContent =
      "✅ REGISTRASI PESERTA";


    alert(

      "❌ GAGAL MENGHUBUNGI SERVER\n\n" +

      "Silakan coba lagi."

    );

  }

  finally {

    sedangRegistrasi =
      false;

  }

}

    // ===============================================
    // MULAI SCAN

    el("mulaiButton")

        mulaiScanner
      );


    // ===============================================
    // CARI MANUAL
    // ===============================================

    el("cariManualButton")
      .addEventListener(

        bukaPencarian
      );


    // ===============================================
    // TOMBOL CARI
    // ===============================================

    el("searchButton")
      .addEventListener(
        "click",
        cariManual
      );


    // ===============================================
    // KEMBALI DARI PENCARIAN
    // ===============================================

    el(
      "kembaliDariPencarianButton"
    )
      .addEventListener(
        "click",
        kembaliKeMenu
      );


    // ===============================================
    // ENTER PADA PENCARIAN
    // ===============================================

    el("inputPencarian")

        function(event) {

            event.preventDefault();

            cariManual();

          }

        }

      );


    console.log(
      "Aplikasi registrasi siap digunakan."
    );

  }

);

</script>
