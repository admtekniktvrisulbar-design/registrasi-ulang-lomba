<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Registrasi Ulang Lomba</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      color: #062b78;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #555;
      margin-bottom: 25px;
      font-size: 18px;
    }

    button {
      width: 100%;
      border: none;
      padding: 15px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #0b3d91;
      color: white;
      margin-top: 10px;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #reader {
      background: white;
      padding: 10px;
      border-radius: 15px;
      margin-top: 20px;
    }

    #hasil {
      display: none;
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-top: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
      text-align: left;
    }

    .success {
      background: #e8f8ed;
      border: 1px solid #54b86b;
      color: #176b2b;
      padding: 15px;
      border-radius: 10px;
      font-weight: bold;
      text-align: center;
    }

    .nomor {
      font-size: 24px;
      margin: 20px 0;
      font-weight: bold;
      text-align: center;
      color: #062b78;
    }

    .row {
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .label {
      font-size: 13px;
      color: #777;
    }

    .value {
      font-size: 17px;
      font-weight: bold;
      color: #222;
      margin-top: 3px;
    }

    .status {
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      margin-top: 10px;
      font-weight: bold;
    }

    .error {
      background: #fdeaea;
      border: 1px solid #e58b87;
      color: #9b1c18;
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
      text-align: center;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #555;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>REGISTRASI ULANG LOMBA</h1>

  <div class="subtitle">
    Lomba Mewarnai dan Menggambar<br>
    TVRI Sulawesi Barat
  </div>


  <button id="mulaiButton"
          onclick="mulaiScanner()">

    📷 MULAI SCAN QR CODE

  </button>


  <div id="reader"></div>


  <div id="hasil">

  </div>

</div>


<script>


// =====================================================
// KONFIGURASI API
// =====================================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbyMWx_Hi3Ka_nzOgbzNCI3MwuSlmptj_hyKtUj1QtsZzrKyHiPICPgeWZFm_dobDG4m/exec";


// =====================================================
// VARIABEL
// =====================================================

let scanner = null;

let sudahScan = false;

let nomorPesertaAktif = "";


// =====================================================
// MULAI SCANNER
// =====================================================

function mulaiScanner() {

  document.getElementById("mulaiButton").style.display = "none";

  document.getElementById("hasil").style.display = "none";

  sudahScan = false;

  scanner = new Html5Qrcode("reader");


  const config = {

    fps: 10,

    qrbox: {
      width: 250,
      height: 250
    }

  };


  scanner.start(

    {
      facingMode: "environment"
    },

    config,

    onScanSuccess,

    onScanFailure

  ).catch(function(error) {

    document.getElementById("mulaiButton").style.display = "block";

    document.getElementById("reader").innerHTML = `

      <div class="error">

        <b>❌ KAMERA TIDAK DAPAT DIAKSES</b>

        <br><br>

        ${error}

      </div>

    `;

  });

}


// =====================================================
// QR BERHASIL DIBACA
// =====================================================

function onScanSuccess(decodedText, decodedResult) {

  if (sudahScan) {
    return;
  }

  sudahScan = true;

  nomorPesertaAktif = decodedText.trim();


  // Hentikan scanner

  if (scanner) {

    scanner.stop().catch(function(error) {

      console.log(
        "Gagal menghentikan scanner:",
        error
      );

    });

  }


  // Tampilkan loading

  document.getElementById("hasil").style.display = "block";

  document.getElementById("hasil").innerHTML = `

    <div class="success">
      🔍 MENCARI DATA PESERTA...
    </div>

    <div class="nomor">
      ${nomorPesertaAktif}
    </div>

    <div class="loading">
      Mohon tunggu...
    </div>

  `;


  // ===================================================
  // PANGGIL GOOGLE APPS SCRIPT
  // ===================================================

  fetch(

    API_URL +
    "?action=cek&nomor=" +
    encodeURIComponent(nomorPesertaAktif)

  )

  .then(function(response) {

    return response.json();

  })

  .then(function(data) {

    console.log(
      "Respons API:",
      data
    );


    if (
      data.success &&
      data.ditemukan
    ) {

      const peserta =
        data.peserta;


      document.getElementById("hasil").innerHTML = `

        <div class="success">
          ✅ PESERTA DITEMUKAN
        </div>


        <div class="row">

          <div class="label">
            Nomor Peserta
          </div>

          <div class="value">
            ${peserta.nomor}
          </div>

        </div>


        <div class="row">

          <div class="label">
            Nama Peserta
          </div>

          <div class="value">
            ${peserta.nama}
          </div>

        </div>


        <div class="row">

          <div class="label">
            Usia
          </div>

          <div class="value">
            ${peserta.usia}
          </div>

        </div>


        <div class="row">

          <div class="label">
            Kategori
          </div>

          <div class="value">
            ${peserta.kategori}
          </div>

        </div>


        <div class="row">

          <div class="label">
            Nama Orang Tua
          </div>

          <div class="value">
            ${peserta.orangtua}
          </div>

        </div>


        <div class="row">

          <div class="label">
            Status Pembayaran
          </div>

          <div class="value">
            ${peserta.statusPembayaran}
          </div>

        </div>


        <div class="row">

          <div class="label">
            Status Registrasi
          </div>

          <div class="value">
            ${peserta.statusRegistrasi}
          </div>

        </div>


        <div class="row">

          <div class="label">
            Waktu Registrasi
          </div>

          <div class="value">
            ${peserta.waktuRegistrasi || "-"}
          </div>

        </div>

      `;


    } else {


      document.getElementById("hasil").innerHTML = `

        <div class="error">

          ❌ PESERTA TIDAK DITEMUKAN

        </div>


        <div class="nomor">

          ${nomorPesertaAktif}

        </div>

      `;

    }

  })


  .catch(function(error) {

    console.error(
      "Error API:",
      error
    );


    document.getElementById("hasil").innerHTML = `

      <div class="error">

        ❌ GAGAL MENGHUBUNGI SERVER

        <br><br>

        ${error.message}

      </div>

    `;

  });

}


// =====================================================
// QR BELUM TERBACA
// =====================================================

function onScanFailure(error) {

  // Tidak menampilkan error.
  // Scanner akan terus mencari QR.

}


</script>

</body>

</html>
