<script>


// =====================================================
// KONFIGURASI API
// =====================================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbyCnvBr41uRfF8FUt-ZmbeF1j7pcazsqBvnSVLkreITP1YYK7ZIvmwlhkFJA1Px9qso/exec";


// =====================================================
// VARIABEL GLOBAL
// =====================================================

let scanner = null;

let sudahScan = false;

let nomorPesertaAktif = "";

let hasilPesertaManual = [];

let sedangMencari = false;

let sedangRegistrasi = false;


// =====================================================
// HELPER ELEMENT
// =====================================================

function el(id) {

  return document.getElementById(id);

}


// =====================================================
// FORMAT WAKTU
// =====================================================

function formatWaktu(waktu) {

  if (!waktu) {

    return "";

  }


  try {

    const tanggal =
      new Date(waktu);


    if (
      isNaN(
        tanggal.getTime()
      )
    ) {

      return waktu;

    }


    return tanggal.toLocaleString(

      "id-ID",

      {

        day:
          "2-digit",

        month:
          "2-digit",

        year:
          "numeric",

        hour:
          "2-digit",

        minute:
          "2-digit",

        second:
          "2-digit",

        hour12:
          false,

        timeZone:
          "Asia/Makassar"

      }

    );

  }

  catch (error) {

    return waktu;

  }

}


// =====================================================
// HENTIKAN SCANNER DENGAN AMAN
// =====================================================

async function hentikanScanner() {

  if (!scanner) {

    return;

  }


  const scannerYangDihentikan =
    scanner;


  scanner = null;


  try {

    await scannerYangDihentikan.stop();

  }

  catch (error) {

    console.log(
      "Scanner sudah berhenti atau tidak aktif:",
      error
    );

  }


  try {

    await scannerYangDihentikan.clear();

  }

  catch (error) {

    console.log(
      "Reader sudah dibersihkan:",
      error
    );

  }

}


// =====================================================
// RESET SEMUA TAMPILAN
// =====================================================

function resetTampilan() {

  el("reader").innerHTML = "";

  el("hasil").innerHTML = "";

  el("hasilPencarian").innerHTML = "";


  el("reader").style.display =
    "none";

  el("hasil").style.display =
    "none";

  el("pencarian").style.display =
    "none";

  el("menuUtama").style.display =
    "block";


  el("inputPencarian").value =
    "";


  hasilPesertaManual = [];

  nomorPesertaAktif = "";

  sudahScan = false;

  sedangMencari = false;

  sedangRegistrasi = false;

}


// =====================================================
// KEMBALI KE MENU
// =====================================================
//
// Fungsi ini sekarang menjadi satu-satunya pusat
// navigasi kembali ke menu utama.
// =====================================================

async function kembaliKeMenu() {

  console.log(
    "KEMBALI KE MENU ditekan."
  );


  // Cegah proses ganda

  if (
    sedangRegistrasi
  ) {

    console.log(
      "Registrasi sedang berlangsung."
    );

    return;

  }


  // Matikan scanner terlebih dahulu

  await hentikanScanner();


  // Bersihkan semua area

  el("reader").innerHTML = "";

  el("hasil").innerHTML = "";

  el("hasilPencarian").innerHTML = "";


  // Sembunyikan semua halaman

  el("reader").style.display =
    "none";

  el("hasil").style.display =
    "none";

  el("pencarian").style.display =
    "none";


  // Tampilkan menu utama

  el("menuUtama").style.display =
    "block";


  // Reset state

  sudahScan = false;

  nomorPesertaAktif = "";

  hasilPesertaManual = [];

  sedangMencari = false;


  // Pastikan tombol menu aktif

  el("mulaiButton").disabled =
    false;

  el("cariManualButton").disabled =
    false;


  console.log(
    "Kembali ke menu berhasil."
  );

}


// =====================================================
// BUKA PENCARIAN MANUAL
// =====================================================

async function bukaPencarian() {

  console.log(
    "Membuka pencarian manual."
  );


  await hentikanScanner();


  el("menuUtama").style.display =
    "none";


  el("reader").style.display =
    "none";


  el("reader").innerHTML =
    "";


  el("hasil").style.display =
    "none";


  el("hasil").innerHTML =
    "";


  el("pencarian").style.display =
    "block";


  el("hasilPencarian").innerHTML =
    "";


  el("inputPencarian").value =
    "";


  nomorPesertaAktif =
    "";

  sudahScan =
    false;


  setTimeout(function() {

    el("inputPencarian").focus();

  }, 100);

}


// =====================================================
// MULAI SCANNER
// =====================================================

async function mulaiScanner() {

  console.log(
    "Memulai scanner."
  );


  // Pastikan scanner lama berhenti

  await hentikanScanner();


  // Reset tampilan

  el("menuUtama").style.display =
    "none";


  el("pencarian").style.display =
    "none";


  el("hasil").style.display =
    "none";


  el("hasil").innerHTML =
    "";


  el("reader").innerHTML =
    "";


  el("reader").style.display =
    "block";


  sudahScan =
    false;


  nomorPesertaAktif =
    "";


  // Buat scanner baru

  scanner =
    new Html5Qrcode(
      "reader"
    );


  const config = {

    fps:
      10,

    qrbox: {

      width:
        250,

      height:
        250

    }

  };


  try {

    await scanner.start(

      {
        facingMode:
          "environment"
      },

      config,

      onScanSuccess,

      onScanFailure

    );


    console.log(
      "Kamera berhasil dimulai."
    );

  }

  catch (error) {

    console.error(
      "Kamera gagal:",
      error
    );


    el("reader").innerHTML = `

      <div class="error">

        ❌ KAMERA TIDAK DAPAT DIAKSES

        <br><br>

        Pastikan izin kamera
        sudah diberikan.

        <br><br>

        ${error}

      </div>

    `;


    el("menuUtama").style.display =
      "block";

  }

}


// =====================================================
// QR BERHASIL DIBACA
// =====================================================

async function onScanSuccess(
  decodedText,
  decodedResult
) {

  if (sudahScan) {

    return;

  }


  sudahScan =
    true;


  nomorPesertaAktif =
    String(
      decodedText
    ).trim();


  console.log(
    "QR terbaca:",
    nomorPesertaAktif
  );


  // Hentikan scanner

  await hentikanScanner();


  // Tampilkan loading

  tampilkanLoading();


  // Cari peserta

  cekPeserta(
    nomorPesertaAktif
  );

}


// =====================================================
// QR GAGAL DIBACA
// =====================================================

function onScanFailure(error) {

  // Tidak perlu menampilkan error.
  // Scanner terus mencari QR.

}


// =====================================================
// TAMPILKAN LOADING
// =====================================================

function tampilkanLoading() {

  const hasil =
    el("hasil");


  hasil.style.display =
    "block";


  hasil.innerHTML = `

    <div class="loading">

      🔄 MENCARI DATA PESERTA...

      <br><br>

      Nomor QR:

      <strong>
        ${nomorPesertaAktif}
      </strong>

      <br><br>

      Mohon tunggu...

    </div>

  `;

}


// =====================================================
// CEK PESERTA DARI QR
// =====================================================

function cekPeserta(nomor) {

  fetch(

    API_URL +
    "?action=cek&nomor=" +
    encodeURIComponent(nomor),

    {
      method:
        "GET",

      cache:
        "no-store"
    }

  )

  .then(function(response) {

    if (!response.ok) {

      throw new Error(
        "HTTP Error " +
        response.status
      );

    }


    return response.json();

  })


  .then(function(data) {

    console.log(
      "Respons API QR:",
      data
    );


    if (

      data.success &&
      data.ditemukan

    ) {

      tampilkanPeserta(
        data.peserta
      );

    }

    else {

      tampilkanPesertaTidakDitemukan(

        data.message ||
        "Nomor peserta tidak ditemukan."

      );

    }

  })


  .catch(function(error) {

    console.error(
      "Error API QR:",
      error
    );


    tampilkanErrorAPI();

  });

}


// =====================================================
// PENCARIAN MANUAL
// =====================================================

async function cariManual() {

  if (sedangMencari) {

    return;

  }


  const input =
    el("inputPencarian");


  const keyword =
    input.value.trim();


  const hasil =
    el("hasilPencarian");


  if (!keyword) {

    alert(
      "Masukkan nama atau nomor peserta."
    );


    input.focus();

    return;

  }


  sedangMencari =
    true;


  hasil.innerHTML = `

    <div class="loading">

      🔄 MENCARI PESERTA...

      <br><br>

      Mohon tunggu...

    </div>

  `;


  const url =

    API_URL +
    "?action=cari&q=" +
    encodeURIComponent(keyword);


  console.log(
    "URL pencarian:",
    url
  );


  try {

    const response =
      await fetch(

        url,

        {

          method:
            "GET",

          cache:
            "no-store"

        }

      );


    console.log(
      "HTTP Status:",
      response.status
    );


    if (!response.ok) {

      throw new Error(

        "HTTP Error " +
        response.status

      );

    }


    const text =
      await response.text();


    console.log(
      "Response mentah:",
      text
    );


    let data;


    try {

      data =
        JSON.parse(text);

    }

    catch (error) {

      throw new Error(
        "Server tidak mengirim JSON yang valid."
      );

    }


    console.log(
      "Data JSON:",
      data
    );


    if (

      data.success === true &&
      data.jumlah > 0 &&
      Array.isArray(data.peserta)

    ) {

      tampilkanHasilPencarian(
        data.peserta
      );

    }

    else {

      hasil.innerHTML = `

        <div class="error">

          ❌ PESERTA TIDAK DITEMUKAN

          <br><br>

          ${
            data.message ||
            "Tidak ada peserta yang cocok."
          }

        </div>

      `;

    }

  }

  catch (error) {

    console.error(
      "Error pencarian:",
      error
    );


    hasil.innerHTML = `

      <div class="error">

        ❌ GAGAL MENGHUBUNGI SERVER

        <br><br>

        Silakan coba lagi.

      </div>

    `;

  }

  finally {

    sedangMencari =
      false;

  }

}


// =====================================================
// TAMPILKAN HASIL PENCARIAN
// =====================================================

function tampilkanHasilPencarian(
  pesertaList
) {

  const hasil =
    el("hasilPencarian");


  hasilPesertaManual =
    pesertaList;


  let html = `

    <div class="result-count">

      Ditemukan
      ${pesertaList.length}
      peserta

    </div>

  `;


  pesertaList.forEach(

    function(peserta, index) {

      html += `

        <div class="result-card">

          <div class="result-number">

            ${peserta.nomor || "-"}

          </div>


          <div class="result-name">

            ${peserta.nama || "-"}

          </div>


          <div class="result-detail">

            Usia:
            ${peserta.usia || "-"}

            <br>

            Kategori:
            ${peserta.kategori || "-"}

          </div>


          <button
            class="choose-button"
            type="button"
            data-index="${index}">

            👤 PILIH PESERTA

          </button>

        </div>

      `;

    }

  );


  hasil.innerHTML =
    html;


  // ===================================================
  // EVENT PILIH PESERTA
  // ===================================================

  const tombolPilih =
    hasil.querySelectorAll(
      ".choose-button"
    );


  tombolPilih.forEach(

    function(button) {

      button.addEventListener(

        "click",

        function() {

          const index =
            Number(
              button.dataset.index
            );


          pilihPesertaDariIndex(
            index
          );

        }

      );

    }

  );

}


// =====================================================
// PILIH PESERTA DARI HASIL PENCARIAN
// =====================================================

function pilihPesertaDariIndex(
  index
) {

  if (

    !Array.isArray(
      hasilPesertaManual
    )

  ) {

    return;

  }


  if (

    !hasilPesertaManual[index]

  ) {

    return;

  }


  const peserta =
    hasilPesertaManual[index];


  pilihPeserta(
    peserta
  );

}


// =====================================================
// PILIH PESERTA
// =====================================================

function pilihPeserta(
  peserta
) {

  nomorPesertaAktif =
    String(
      peserta.nomor || ""
    ).trim();


  el("pencarian").style.display =
    "none";


  el("hasil").style.display =
    "block";


  tampilkanPeserta(
    peserta
  );

}


// =====================================================
// TAMPILKAN DATA PESERTA
// =====================================================

function tampilkanPeserta(
  peserta
) {

  const hasil =
    el("hasil");


  hasil.style.display =
    "block";


  // ===================================================
  // STATUS PEMBAYARAN
  // ===================================================

  let kelasPembayaran =
    "status-belum";


  if (

    String(
      peserta.statusPembayaran
    ).trim() === "Lunas"

  ) {

    kelasPembayaran =
      "status-lunas";

  }


  // ===================================================
  // STATUS REGISTRASI
  // ===================================================

  let kelasRegistrasi =
    "status-belum";


  if (

    String(
      peserta.statusRegistrasi
    ).trim() ===
    "Sudah Registrasi"

  ) {

    kelasRegistrasi =
      "status-sudah";

  }


  const sudahRegistrasi =

    String(
      peserta.statusRegistrasi
    ).trim() ===
    "Sudah Registrasi";


  const pembayaranLunas =

    String(
      peserta.statusPembayaran
    ).trim() ===
    "Lunas";


  // ===================================================
  // TOMBOL REGISTRASI
  // ===================================================

  let tombolRegistrasi =
    "";


  if (sudahRegistrasi) {

    tombolRegistrasi = `

      <button
        class="registrasi-button"
        type="button"
        disabled>

        ✅ SUDAH REGISTRASI

      </button>

    `;

  }

  else if (!pembayaranLunas) {

    tombolRegistrasi = `

      <button
        class="registrasi-button"
        type="button"
        disabled>

        🔒 PEMBAYARAN BELUM LUNAS

      </button>

    `;

  }

  else {

    tombolRegistrasi = `

      <button
        id="registrasiButton"
        class="registrasi-button"
        type="button">

        ✅ REGISTRASI PESERTA

      </button>

    `;

  }


  // ===================================================
  // WAKTU REGISTRASI
  // ===================================================

  let waktuHTML =
    "";


  if (
    peserta.waktuRegistrasi
  ) {

    waktuHTML = `

      <div class="waktu">

        Waktu Registrasi:<br>

        <strong>

          ${formatWaktu(
            peserta.waktuRegistrasi
          )}

        </strong>

      </div>

    `;

  }


  // ===================================================
  // TAMPILKAN
  // ===================================================

  hasil.innerHTML = `

    <div class="success">

      ✅ PESERTA DITEMUKAN

    </div>


    <div class="nomor">

      ${peserta.nomor || "-"}

    </div>


    <div class="data">


      <div class="row">

        <div class="label">

          Nama Peserta

        </div>

        <div class="value">

          ${peserta.nama || "-"}

        </div>

      </div>


      <div class="row">

        <div class="label">

          Usia

        </div>

        <div class="value">

          ${peserta.usia || "-"}

        </div>

      </div>


      <div class="row">

        <div class="label">

          Nama Orang Tua

        </div>

        <div class="value">

          ${peserta.orangtua || "-"}

        </div>

      </div>


      <div class="row">

        <div class="label">

          Kategori

        </div>

        <div class="value">

          ${peserta.kategori || "-"}

        </div>

      </div>


      <div class="row">

        <div class="label">

          Status Pembayaran

        </div>

        <div
          class="status ${kelasPembayaran}">

          ${peserta.statusPembayaran || "-"}

        </div>

      </div>


      <div class="row">

        <div class="label">

          Status Registrasi

        </div>

        <div
          id="statusRegistrasi"
          class="status ${kelasRegistrasi}">

          ${peserta.statusRegistrasi || "-"}

        </div>

      </div>


      ${waktuHTML}


      ${tombolRegistrasi}


      <button
        id="kembaliKeMenuDariHasil"
        class="secondary-button"
        type="button">

        ← KEMBALI KE MENU

      </button>


    </div>

  `;


  // ===================================================
  // EVENT BUTTON REGISTRASI
  // ===================================================

  const tombolRegistrasiElement =
    el("registrasiButton");


  if (
    tombolRegistrasiElement
  ) {

    tombolRegistrasiElement
      .addEventListener(
        "click",
        registrasiPeserta
      );

  }


  // ===================================================
  // EVENT BUTTON KEMBALI
  // ===================================================

  const tombolKembali =
    el(
      "kembaliKeMenuDariHasil"
    );


  if (tombolKembali) {

    tombolKembali
      .addEventListener(
        "click",
        kembaliKeMenu
      );

  }

}

// =====================================================
// REGISTRASI PESERTA
// =====================================================

async function registrasiPeserta() {

  if (!nomorPesertaAktif) {

    alert(
      "Nomor peserta tidak ditemukan."
    );

    return;

  }


  if (sedangRegistrasi) {

    return;

  }


  const button =
    el("registrasiButton");


  if (!button) {

    return;

  }


  sedangRegistrasi =
    true;


  button.disabled =
    true;


  button.textContent =
    "⏳ MEMPROSES...";


  console.log(
    "Registrasi peserta:",
    nomorPesertaAktif
  );


  try {

    const response =
      await fetch(

        API_URL +
        "?action=registrasi&nomor=" +
        encodeURIComponent(
          nomorPesertaAktif
        ),

        {
          method:
            "GET",

          cache:
            "no-store"
        }

      );


    if (!response.ok) {

      throw new Error(

        "HTTP Error " +
        response.status

      );

    }


    const data =
      await response.json();


    console.log(
      "Respons registrasi:",
      data
    );


    if (data.success) {


      // ===============================================
      // UPDATE STATUS
      // ===============================================

      const status =
        el("statusRegistrasi");


      if (status) {

        status.textContent =
          "Sudah Registrasi";


        status.className =
          "status status-sudah";

      }


      // ===============================================
      // UPDATE BUTTON
      // ===============================================

      button.textContent =
        "✅ REGISTRASI BERHASIL";


      button.disabled =
        true;


      // ===============================================
      // UPDATE WAKTU
      // ===============================================

      const waktuBaru =
        formatWaktu(
          data.waktu
        );


      const waktuLama =
        document.querySelector(
          ".waktu"
        );


      if (waktuLama) {

        waktuLama.innerHTML = `

          Waktu Registrasi:<br>

          <strong>

            ${waktuBaru}

          </strong>

        `;

      }

      else {

        const dataContainer =
          document.querySelector(
            ".data"
          );


        if (dataContainer) {

          const div =
            document.createElement(
              "div"
            );


          div.className =
            "waktu";


          div.innerHTML = `

            Waktu Registrasi:<br>

            <strong>

              ${waktuBaru}

            </strong>

          `;


          dataContainer.insertBefore(
            div,
            button
          );

        }

      }


      // ===============================================
      // NOTIFIKASI
      // ===============================================

      alert(

        "✅ REGISTRASI BERHASIL!\n\n" +

        "Nomor Peserta: " +
        data.nomor +

        "\nNama: " +
        data.nama +

        "\nWaktu: " +
        waktuBaru

      );

    }

    else {

      button.disabled =
        false;


      button.textContent =
        "✅ REGISTRASI PESERTA";


      alert(

        "❌ REGISTRASI GAGAL\n\n" +

        (
          data.message ||
          "Terjadi kesalahan."
        )

      );

    }

  }

  catch (error) {

    console.error(
      "Error registrasi:",
      error
    );


    button.disabled =
      false;


    button.textContent =
      "✅ REGISTRASI PESERTA";


    alert(

      "❌ GAGAL MENGHUBUNGI SERVER\n\n" +

      "Silakan coba lagi."

    );

  }

  finally {

    sedangRegistrasi =
      false;

  }

}


// =====================================================
// EVENT LISTENER MENU
// =====================================================
//
// Semua tombol navigasi utama sekarang menggunakan
// addEventListener. Tidak lagi menggunakan inline
// onclick untuk tombol-tombol navigasi.
// =====================================================

document.addEventListener(
  "DOMContentLoaded",
  function() {


    // ===============================================
    // MULAI SCAN
    // ===============================================

    el("mulaiButton")
      .addEventListener(
        "click",
        mulaiScanner
      );


    // ===============================================
    // CARI MANUAL
    // ===============================================

    el("cariManualButton")
      .addEventListener(
        "click",
        bukaPencarian
      );


    // ===============================================
    // TOMBOL CARI
    // ===============================================

    el("searchButton")
      .addEventListener(
        "click",
        cariManual
      );


    // ===============================================
    // KEMBALI DARI PENCARIAN
    // ===============================================

    el(
      "kembaliDariPencarianButton"
    )
      .addEventListener(
        "click",
        kembaliKeMenu
      );


    // ===============================================
    // ENTER PADA INPUT PENCARIAN
    // ===============================================

    el("inputPencarian")
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key ===
            "Enter"
          ) {

            event.preventDefault();

            cariManual();

          }

        }
      );


    console.log(
      "Aplikasi registrasi siap digunakan."
    );

  }

);

</script>
