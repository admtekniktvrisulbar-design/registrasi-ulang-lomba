<script>


// =====================================================
// KONFIGURASI API
// =====================================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbyCnvBr41uRfF8FUt-ZmbeF1j7pcazsqBvnSVLkreITP1YYK7ZIvmwlhkFJA1Px9qso/exec";


// =====================================================
// VARIABEL GLOBAL
// =====================================================

let scanner = null;

let sudahScan = false;

let idPesertaAktif = "";

let nomorPesertaHasilRegistrasi = "";

let hasilPesertaManual = [];

let sedangMencari = false;

let sedangRegistrasi = false;


// =====================================================
// HELPER ELEMENT
// =====================================================

function el(id) {

  return document.getElementById(id);

}


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHTML(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }

  return String(value)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}


// =====================================================
// NORMALISASI ID
// =====================================================
//
// Digunakan supaya:
//
// MW46-001
//
// dan:
//
// mw46-001
//
// tetap dianggap ID yang sama.
// =====================================================

function normalisasiID(value) {

  return String(
    value || ""
  )
    .trim()
    .toUpperCase();

}


// =====================================================
// FORMAT WAKTU
// =====================================================

function formatWaktu(waktu) {

  if (
    waktu === null ||
    waktu === undefined ||
    waktu === ""
  ) {

    return "";

  }

  try {

    let tanggal;


    if (
      waktu instanceof Date
    ) {

      tanggal =
        waktu;

    }

    else if (
      typeof waktu === "number"
    ) {

      if (
        waktu > 100000000000
      ) {

        tanggal =
          new Date(waktu);

      }

      else if (
        waktu > 1000000000
      ) {

        tanggal =
          new Date(
            waktu * 1000
          );

      }

      else {

        tanggal =
          new Date(
            (
              waktu - 25569
            ) *
            86400000
          );

      }

    }

    else {

      const nilai =
        String(waktu).trim();


      if (
        /^\d{4}-\d{2}-\d{2}T/.test(
          nilai
        )
      ) {

        tanggal =
          new Date(nilai);

      }

      else if (
        /^\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}/.test(
          nilai
        )
      ) {

        const bagian =
          nilai.split(/\s+/);

        const tanggalBagian =
          bagian[0].split("-");

        const waktuBagian =
          (
            bagian[1] ||
            "00:00:00"
          ).split(":");


        tanggal =
          new Date(

            Number(
              tanggalBagian[0]
            ),

            Number(
              tanggalBagian[1]
            ) - 1,

            Number(
              tanggalBagian[2]
            ),

            Number(
              waktuBagian[0]
            ),

            Number(
              waktuBagian[1]
            ),

            Number(
              waktuBagian[2] || 0
            )

          );

      }

      else if (
        /^\d{2}\/\d{2}\/\d{4}/.test(
          nilai
        )
      ) {

        const bersih =
          nilai.replace(
            ",",
            " "
          );

        const bagian =
          bersih.split(/\s+/);

        const tanggalBagian =
          bagian[0].split("/");

        const waktuBagian =
          (
            bagian[1] ||
            "00:00:00"
          ).split(":");


        tanggal =
          new Date(

            Number(
              tanggalBagian[2]
            ),

            Number(
              tanggalBagian[1]
            ) - 1,

            Number(
              tanggalBagian[0]
            ),

            Number(
              waktuBagian[0]
            ),

            Number(
              waktuBagian[1]
            ),

            Number(
              waktuBagian[2] || 0
            )

          );

      }

      else {

        tanggal =
          new Date(nilai);

      }

    }


    if (
      !tanggal ||
      isNaN(
        tanggal.getTime()
      )
    ) {

      return String(waktu);

    }


    return tanggal.toLocaleString(

      "id-ID",

      {

        day:
          "2-digit",

        month:
          "2-digit",

        year:
          "numeric",

        hour:
          "2-digit",

        minute:
          "2-digit",

        second:
          "2-digit",

        hour12:
          false,

        timeZone:
          "Asia/Makassar"

      }

    );

  }

  catch (error) {

    console.error(
      "Gagal memformat waktu:",
      error
    );

    return String(waktu);

  }

}


// =====================================================
// HENTIKAN SCANNER
// =====================================================

async function hentikanScanner() {

  if (!scanner) {

    return;

  }


  const scannerYangDihentikan =
    scanner;


  scanner =
    null;


  try {

    await scannerYangDihentikan.stop();

  }

  catch (error) {

    console.log(
      "Scanner sudah berhenti."
    );

  }


  try {

    await scannerYangDihentikan.clear();

  }

  catch (error) {

    console.log(
      "Reader sudah dibersihkan."
    );

  }

}


// =====================================================
// RESET TAMPILAN
// =====================================================

function resetTampilan() {

  el("reader").innerHTML =
    "";

  el("hasil").innerHTML =
    "";

  el("hasilPencarian").innerHTML =
    "";

  el("reader").style.display =
    "none";

  el("hasil").style.display =
    "none";

  el("pencarian").style.display =
    "none";

  el("menuUtama").style.display =
    "block";

  el("inputPencarian").value =
    "";

  hasilPesertaManual =
    [];

  idPesertaAktif =
    "";

  nomorPesertaHasilRegistrasi =
    "";

  sudahScan =
    false;

  sedangMencari =
    false;

  sedangRegistrasi =
    false;

}


// =====================================================
// KEMBALI KE MENU
// =====================================================

async function kembaliKeMenu() {

  if (sedangRegistrasi) {

    return;

  }


  await hentikanScanner();


  el("reader").innerHTML =
    "";

  el("hasil").innerHTML =
    "";

  el("hasilPencarian").innerHTML =
    "";

  el("reader").style.display =
    "none";

  el("hasil").style.display =
    "none";

  el("pencarian").style.display =
    "none";

  el("menuUtama").style.display =
    "block";

  sudahScan =
    false;

  idPesertaAktif =
    "";

  nomorPesertaHasilRegistrasi =
    "";

  hasilPesertaManual =
    [];

  sedangMencari =
    false;

  el("mulaiButton").disabled =
    false;

  el("cariManualButton").disabled =
    false;

}


// =====================================================
// BUKA PENCARIAN MANUAL
// =====================================================

async function bukaPencarian() {

  await hentikanScanner();


  el("menuUtama").style.display =
    "none";

  el("reader").style.display =
    "none";

  el("reader").innerHTML =
    "";

  el("hasil").style.display =
    "none";

  el("hasil").innerHTML =
    "";

  el("pencarian").style.display =
    "block";

  el("hasilPencarian").innerHTML =
    "";

  el("inputPencarian").value =
    "";

  idPesertaAktif =
    "";

  nomorPesertaHasilRegistrasi =
    "";

  sudahScan =
    false;


  setTimeout(
    function() {

      el("inputPencarian").focus();

    },
    100
  );

}


// =====================================================
// MULAI SCANNER
// =====================================================

async function mulaiScanner() {

  await hentikanScanner();


  el("menuUtama").style.display =
    "none";

  el("pencarian").style.display =
    "none";

  el("hasil").style.display =
    "none";

  el("hasil").innerHTML =
    "";

  el("reader").innerHTML =
    "";

  el("reader").style.display =
    "block";


  sudahScan =
    false;

  idPesertaAktif =
    "";

  nomorPesertaHasilRegistrasi =
    "";


  scanner =
    new Html5Qrcode(
      "reader"
    );


  const config = {

    fps:
      10,

    qrbox: {

      width:
        250,

      height:
        250

    }

  };


  try {

    await scanner.start(

      {
        facingMode:
          "environment"
      },

      config,

      onScanSuccess,

      onScanFailure

    );


    console.log(
      "Kamera berhasil dimulai."
    );

  }

  catch (error) {

    console.error(
      "Kamera gagal:",
      error
    );


    el("reader").innerHTML = `

      <div class="error">

        ❌ KAMERA TIDAK DAPAT DIAKSES

        <br><br>

        Pastikan izin kamera
        sudah diberikan.

        <br><br>

        ${escapeHTML(error)}

      </div>

    `;


    el("menuUtama").style.display =
      "block";

  }

}


// =====================================================
// QR BERHASIL DIBACA
// =====================================================
//
// PERUBAHAN UTAMA:
//
// QR -> ID Peserta
//
// kemudian ID Peserta dicari melalui:
//
// action=cari&q=ID
//
// sehingga hasilnya sama seperti pencarian manual.
// =====================================================

async function onScanSuccess(
  decodedText,
  decodedResult
) {

  if (sudahScan) {

    return;

  }


  sudahScan =
    true;


  idPesertaAktif =
    String(
      decodedText
    ).trim();


  console.log(
    "QR dibaca. ID Peserta:",
    idPesertaAktif
  );


  await hentikanScanner();


  if (!idPesertaAktif) {

    tampilkanPesertaTidakDitemukan(
      "QR Code tidak berisi ID Peserta."
    );

    return;

  }


  tampilkanLoading();


  await cariPesertaDariQR(
    idPesertaAktif
  );

}


// =====================================================
// PENCARIAN PESERTA DARI QR
// =====================================================
//
// Menggunakan endpoint "cari" yang sama dengan
// pencarian manual.
// =====================================================

async function cariPesertaDariQR(
  idQR
) {

  const idYangDicari =
    String(
      idQR || ""
    ).trim();


  if (!idYangDicari) {

    tampilkanPesertaTidakDitemukan(
      "ID Peserta kosong."
    );

    return;

  }


  const url =

    API_URL +
    "?action=cari&q=" +
    encodeURIComponent(
      idYangDicari
    );


  try {

    console.log(
      "Mencari ID dari QR:",
      idYangDicari
    );


    const response =
      await fetch(

        url,

        {

          method:
            "GET",

          cache:
            "no-store"

        }

      );


    if (!response.ok) {

      throw new Error(
        "HTTP Error " +
        response.status
      );

    }


    const text =
      await response.text();


    let data;


    try {

      data =
        JSON.parse(text);

    }

    catch (error) {

      console.error(
        "Respons server bukan JSON:",
        text
      );

      throw new Error(
        "Server tidak mengirim JSON yang valid."
      );

    }


    console.log(
      "Respons pencarian QR:",
      data
    );


    if (

      data.success === true &&

      Array.isArray(
        data.peserta
      ) &&

      data.peserta.length > 0

    ) {

      // =================================================
      // CARI HASIL YANG ID-NYA PERSIS SAMA
      // DENGAN ISI QR
      // =================================================

      const idNormal =
        normalisasiID(
          idYangDicari
        );


      let peserta =
        data.peserta.find(

          function(item) {

            return (

              normalisasiID(
                item.idPeserta
              ) ===
              idNormal

            );

          }

        );


      // =================================================
      // Jika tidak ada kecocokan persis tetapi API
      // hanya mengembalikan satu peserta, gunakan
      // peserta tersebut.
      // =================================================

      if (
        !peserta &&
        data.peserta.length === 1
      ) {

        peserta =
          data.peserta[0];

      }


      if (peserta) {

        // ===============================================
        // PENTING:
        // ID AKTIF TETAP ID PESERTA
        // ===============================================

        idPesertaAktif =
          String(
            peserta.idPeserta ||
            idYangDicari
          ).trim();


        nomorPesertaHasilRegistrasi =
          String(
            peserta.nomor ||
            ""
          ).trim();


        tampilkanPeserta(
          peserta
        );


        return;

      }

    }


    tampilkanPesertaTidakDitemukan(

      data.message ||
      "ID Peserta tidak ditemukan."

    );

  }

  catch (error) {

    console.error(
      "Error pencarian QR:",
      error
    );


    tampilkanErrorAPI();

  }

}


// =====================================================
// QR GAGAL
// =====================================================

function onScanFailure(error) {

  // Tidak menampilkan error
  // karena callback ini dipanggil terus
  // selama kamera aktif.

}


// =====================================================

// =====================================================

function tampilkanLoading() {

  const hasil =

  hasil.style.display =

  hasil.innerHTML = `

    <div class="loading">

      🔄 MENCARI DATA PESERTA...

      <br><br>

      ID Peserta:

      <strong>

        ${escapeHTML(
          idPesertaAktif
        )}

      </strong>

      <br><br>

      Mohon tunggu...

    </div>

  `;

}


// =====================================================
// PENCARIAN MANUAL
// =====================================================

async function cariManual() {

  if (sedangMencari) {

    return;

  }


  const input =
    el("inputPencarian");


  const keyword =
    input.value.trim();


  const hasil =
    el("hasilPencarian");


  if (!keyword) {

    alert(
      "Masukkan ID Peserta, nomor peserta, atau nama peserta."
    );


    input.focus();

    return;

  }


  sedangMencari =
    true;


  hasil.innerHTML = `

    <div class="loading">

      🔄 MENCARI PESERTA...

      <br><br>

      Mohon tunggu...

    </div>

  `;


  const url =

    API_URL +
    "?action=cari&q=" +
    encodeURIComponent(
      keyword
    );


  try {

    const response =
      await fetch(

        url,

        {

          method:
            "GET",

          cache:
            "no-store"

        }

      );


    if (!response.ok) {

      throw new Error(
        "HTTP Error " +
        response.status
      );

    }


    const text =
      await response.text();


    let data;


    try {

      data =
        JSON.parse(text);

    }

    catch (error) {

      throw new Error(
        "Server tidak mengirim JSON yang valid."
      );

    }


    console.log(
      "Data pencarian:",
      data
    );


    if (

      data.success === true &&

      data.jumlah > 0 &&

      Array.isArray(
        data.peserta
      )

    ) {

      tampilkanHasilPencarian(
        data.peserta
      );

    }

    else {

      hasil.innerHTML = `

        <div class="error">

          ❌ PESERTA TIDAK DITEMUKAN

          <br><br>

          ${escapeHTML(
            data.message ||
            "Tidak ada peserta yang cocok."
          )}

        </div>

      `;

    }

  }

  catch (error) {

    console.error(
      "Error pencarian:",
      error
    );


    hasil.innerHTML = `

      <div class="error">

        ❌ GAGAL MENGHUBUNGI SERVER

        <br><br>

        Silakan coba lagi.

      </div>

    `;

  }

  finally {

    sedangMencari =
      false;

  }

}


// =====================================================
// TAMPILKAN HASIL PENCARIAN
// =====================================================

function tampilkanHasilPencarian(
  pesertaList
) {

  const hasil =
    el("hasilPencarian");


  hasilPesertaManual =
    pesertaList;


  let html = `

    <div class="result-count">

      Ditemukan
      ${pesertaList.length}
      peserta

    </div>

  `;


  pesertaList.forEach(

    function(peserta, index) {

      const sudahRegistrasi =

        String(
          peserta.statusRegistrasi || ""
        ).trim() ===
        "Sudah Registrasi";


      const nomorTampilan =

        sudahRegistrasi

          ? (
              peserta.nomor ||
              peserta.idPeserta ||
              "-"
            )

          : (
              peserta.idPeserta ||
              peserta.nomor ||
              "-"
            );


      html += `

        <div class="result-card">

          <div class="result-number">

            ${escapeHTML(
              nomorTampilan
            )}

          </div>


          <div class="result-name">

            ${escapeHTML(
              peserta.nama || "-"
            )}

          </div>


          <div class="result-detail">

            ID Peserta:
            ${escapeHTML(
              peserta.idPeserta || "-"
            )}

            <br>

            Nomor Peserta:
            ${escapeHTML(
              peserta.nomor ||
              "Belum ditentukan"
            )}

            <br>

            Usia:
            ${escapeHTML(
              peserta.usia || "-"
            )}

            <br>

            Kategori:
            ${escapeHTML(
              peserta.kategori || "-"
            )}

            <br>

            Status:
            ${escapeHTML(
              peserta.statusRegistrasi || "-"
            )}

          </div>


          <button
            class="choose-button"
            type="button"
            data-index="${index}">

            👤 PILIH PESERTA

          </button>

        </div>

      `;

    }

  );


  hasil.innerHTML =
    html;


  const tombolPilih =
    hasil.querySelectorAll(
      ".choose-button"
    );


  tombolPilih.forEach(

    function(button) {

      button.addEventListener(

        "click",

        function() {

          const index =
            Number(
              button.dataset.index
            );


          pilihPesertaDariIndex(
            index
          );

        }

      );

    }

  );

}


// =====================================================
// PILIH PESERTA DARI HASIL PENCARIAN
// =====================================================

function pilihPesertaDariIndex(
  index
) {

  if (
    !Array.isArray(
      hasilPesertaManual
    )
  ) {

    return;

  }


  if (
    !hasilPesertaManual[index]
  ) {

    return;

  }


  pilihPeserta(
    hasilPesertaManual[index]
  );

}


// =====================================================
// PILIH PESERTA
// =====================================================

function pilihPeserta(
  peserta
) {

  idPesertaAktif =
    String(
      peserta.idPeserta ||
      ""
    ).trim();


  if (!idPesertaAktif) {

    idPesertaAktif =
      String(
        peserta.nomor ||
        ""
      ).trim();

  }


  nomorPesertaHasilRegistrasi =
    String(
      peserta.nomor ||
      ""
    ).trim();


  el("pencarian").style.display =
    "none";

  el("hasil").style.display =
    "block";


  tampilkanPeserta(
    peserta
  );

}


// =====================================================
// TAMPILKAN DATA PESERTA
// =====================================================

function tampilkanPeserta(
  peserta
) {

  const hasil =
    el("hasil");


  hasil.style.display =
    "block";


  const idPeserta =

    String(
      peserta.idPeserta ||
      idPesertaAktif ||
      ""
    ).trim();


  const nomorPeserta =

    String(
      peserta.nomor ||
      ""
    ).trim();


  const statusPembayaran =

    String(
      peserta.statusPembayaran ||
      ""
    ).trim();


  const statusRegistrasi =

    String(
      peserta.statusRegistrasi ||
      ""
    ).trim();


  const sudahRegistrasi =

    statusRegistrasi ===
    "Sudah Registrasi";


  const pembayaranLunas =

    statusPembayaran ===
    "Lunas";


  if (idPeserta) {

    idPesertaAktif =
      idPeserta;

  }


  let kelasPembayaran =
    "status-belum";


  if (pembayaranLunas) {

    kelasPembayaran =
      "status-lunas";

  }


  let kelasRegistrasi =
    "status-belum";


  if (sudahRegistrasi) {

    kelasRegistrasi =
      "status-sudah";

  }


  let nomorUtamaHTML =
    "";


  if (
    sudahRegistrasi &&
    nomorPeserta
  ) {

    nomorUtamaHTML = `

      <div class="nomor-registrasi">

        <div class="nomor-registrasi-label">

          Nomor Peserta

        </div>

        <div class="nomor-registrasi-value">

          ${escapeHTML(
            nomorPeserta
          )}

        </div>

      </div>

    `;

  }

  else {

    nomorUtamaHTML = `

      <div class="nomor-label">

        ID Peserta

      </div>

      <div class="nomor">

        ${escapeHTML(
          idPeserta || "-"
        )}

      </div>

    `;

  }


  let tombolRegistrasi =
    "";


  if (sudahRegistrasi) {

    tombolRegistrasi = `

      <button
        id="registrasiButton"
        class="registrasi-button"
        type="button"
        disabled>

        ✅ REGISTRASI BERHASIL

      </button>

    `;

  }

  else if (!pembayaranLunas) {

    tombolRegistrasi = `

      <button
        id="registrasiButton"
        class="registrasi-button"
        type="button"
        disabled>

        🔒 PEMBAYARAN BELUM LUNAS

      </button>

    `;

  }

  else {

    tombolRegistrasi = `

      <button
        id="registrasiButton"
        class="registrasi-button"
        type="button">

        ✅ REGISTRASI PESERTA

      </button>

    `;

  }


  let waktuHTML =
    "";


  if (
    peserta.waktuRegistrasi
  ) {

    waktuHTML = `

      <div class="waktu">

        Waktu Registrasi:<br>

        <strong>

          ${escapeHTML(
            formatWaktu(
              peserta.waktuRegistrasi
            )
          )}

        </strong>

      </div>

    `;

  }


  hasil.innerHTML = `

    <div class="success">

      ✅ PESERTA DITEMUKAN

    </div>


    ${nomorUtamaHTML}


    <div class="data">


      ${
        !sudahRegistrasi && idPeserta
          ? `
            <div class="row">

              <div class="label">

                ID Peserta

              </div>

              <div class="value">

                ${escapeHTML(
                  idPeserta
                )}

              </div>

            </div>
          `
          : ""
      }


      <div class="row">

        <div class="label">

          Nama Peserta

        </div>

        <div class="value">

          ${escapeHTML(
            peserta.nama || "-"
          )}

        </div>

      </div>


      <div class="row">

        <div class="label">

          Usia

        </div>

        <div class="value">

          ${escapeHTML(
            peserta.usia || "-"
          )}

        </div>

      </div>


      <div class="row">

        <div class="label">

          Nama Orang Tua

        </div>

        <div class="value">

          ${escapeHTML(
            peserta.orangtua || "-"
          )}

        </div>

      </div>


      <div class="row">

        <div class="label">

          Kategori

        </div>

        <div class="value">

          ${escapeHTML(
            peserta.kategori || "-"
          )}

        </div>

      </div>


      <div class="row">

        <div class="label">

          Status Pembayaran

        </div>

        <div
          class="status ${kelasPembayaran}">

          ${escapeHTML(
            peserta.statusPembayaran || "-"
          )}

        </div>

      </div>


      <div class="row">

        <div class="label">

          Status Registrasi

        </div>

        <div
          id="statusRegistrasi"
          class="status ${kelasRegistrasi}">

          ${escapeHTML(
            peserta.statusRegistrasi || "-"
          )}

        </div>

      </div>


      ${waktuHTML}


      ${tombolRegistrasi}


      <button
        id="kembaliKeMenuDariHasil"
        class="secondary-button"
        type="button">

        ← KEMBALI KE MENU

      </button>


    </div>

  `;


  const tombolRegistrasiElement =
    el("registrasiButton");


  if (
    tombolRegistrasiElement &&
    !sudahRegistrasi &&
    pembayaranLunas
  ) {

    tombolRegistrasiElement
      .addEventListener(
        "click",
        registrasiPeserta
      );

  }


  const tombolKembali =
    el(
      "kembaliKeMenuDariHasil"
    );


  if (tombolKembali) {

    tombolKembali
      .addEventListener(
        "click",
        kembaliKeMenu
      );

  }

}

// =====================================================
// REGISTRASI PESERTA
// =====================================================
//
// API menerima:
//
// ID Peserta
//
// contoh:
//
// MW46-001
//
// API menghasilkan:
//
// A-001
//
// ID Peserta TIDAK PERNAH diganti menjadi A-001.
// =====================================================

async function registrasiPeserta() {

  if (!idPesertaAktif) {

    alert(
      "ID Peserta tidak ditemukan."
    );

    return;

  }


  if (sedangRegistrasi) {

    return;

  }


  const button =
    el("registrasiButton");


  if (!button) {

    return;

  }


  sedangRegistrasi =
    true;


  button.disabled =
    true;


  button.textContent =
    "⏳ MEMPROSES...";


  console.log(
    "Registrasi menggunakan ID Peserta:",
    idPesertaAktif
  );


  try {

    const response =
      await fetch(

        API_URL +
        "?action=registrasi&nomor=" +
        encodeURIComponent(
          idPesertaAktif
        ),

        {

          method:
            "GET",

          cache:
            "no-store"

        }

      );


    if (!response.ok) {

      throw new Error(
        "HTTP Error " +
        response.status
      );

    }


    const data =
      await response.json();


    console.log(
      "Respons registrasi:",
      data
    );


    if (data.success) {

      nomorPesertaHasilRegistrasi =
        String(
          data.nomor ||
          ""
        ).trim();


      const status =
        el("statusRegistrasi");


      if (status) {

        status.textContent =
          "Sudah Registrasi";

        status.className =
          "status status-sudah";

      }


      // =================================================
      // GANTI TAMPILAN ID UTAMA MENJADI NOMOR PESERTA
      // =================================================

      const nomorLabel =
        document.querySelector(
          ".nomor-label"
        );


      const nomorElement =
        document.querySelector(
          ".nomor"
        );


      if (
        nomorLabel &&
        nomorElement
      ) {

        nomorLabel.outerHTML = `

          <div class="nomor-registrasi">

            <div class="nomor-registrasi-label">

              Nomor Peserta

            </div>

            <div class="nomor-registrasi-value">

              ${escapeHTML(
                nomorPesertaHasilRegistrasi
              )}

            </div>

          </div>

        `;


        if (
          nomorElement.parentNode
        ) {

          nomorElement.remove();

        }

      }


      // =================================================
      // UPDATE WAKTU
      // =================================================

      const waktuBaru =
        formatWaktu(
          data.waktu
        );


      const waktuLama =
        document.querySelector(
          ".waktu"
        );


      if (waktuLama) {

        waktuLama.innerHTML = `

          Waktu Registrasi:<br>

          <strong>

            ${escapeHTML(
              waktuBaru
            )}

          </strong>

        `;

      }

      else {

        const dataContainer =
          document.querySelector(
            ".data"
          );


        if (dataContainer) {

          const div =
            document.createElement(
              "div"
            );


          div.className =
            "waktu";


          div.innerHTML = `

            Waktu Registrasi:<br>

            <strong>

              ${escapeHTML(
                waktuBaru
              )}

            </strong>

          `;


          dataContainer.insertBefore(
            div,
            button
          );

        }

      }


      button.textContent =
        "✅ REGISTRASI BERHASIL";


      button.disabled =
        true;


      alert(

        "✅ REGISTRASI BERHASIL!\n\n" +

        "Nomor Peserta: " +
        (
          data.nomor ||
          "-"
        ) +

        "\nNama: " +
        (
          data.nama ||
          "-"
        ) +

        "\nWaktu: " +
        (
          waktuBaru ||
          "-"
        )

      );

    }


    else {

      if (
        data.sudahRegistrasi &&
        data.nomor
      ) {

        nomorPesertaHasilRegistrasi =
          String(
            data.nomor
          ).trim();


        button.textContent =
          "✅ REGISTRASI BERHASIL";


        button.disabled =
          true;


        const status =
          el("statusRegistrasi");


        if (status) {

          status.textContent =
            "Sudah Registrasi";


          status.className =
            "status status-sudah";

        }


        alert(

          "Peserta ini sudah melakukan registrasi.\n\n" +

          "Nomor Peserta: " +
          data.nomor

        );


        return;

      }


      button.disabled =
        false;


      button.textContent =
        "✅ REGISTRASI PESERTA";


      alert(

        "❌ REGISTRASI GAGAL\n\n" +

        (
          data.message ||
          "Terjadi kesalahan."
        )

      );

    }

  }

  catch (error) {

    console.error(
      "Error registrasi:",
      error
    );


    button.disabled =
      false;


    button.textContent =
      "✅ REGISTRASI PESERTA";


    alert(

      "❌ GAGAL MENGHUBUNGI SERVER\n\n" +

      "Silakan coba lagi."

    );

  }

  finally {

    sedangRegistrasi =
      false;

  }

}
